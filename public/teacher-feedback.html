<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信息反馈管理 - ClassShow</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .sort-pills {
      display: inline-flex;
      gap: 8px;
      padding: 4px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .sort-pill {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .sort-pill.active {
      background: var(--primary);
      color: #fff;
      box-shadow: var(--shadow);
    }
    .sort-pill:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .feedback-note {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      background: var(--accent-light);
      color: #92400e;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }
    .feedback-content {
      min-width: 280px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
    }
    .feedback-meta {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-top: 6px;
    }
    .feedback-like-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary-hover);
      font-weight: 700;
      font-size: 0.82rem;
    }
    .feedback-empty {
      padding: 48px 16px;
      text-align: center;
      color: var(--text-muted);
    }
    .search-box {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      width: 240px;
      font: inherit;
      background: var(--surface);
    }
    .moderation-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .moderation-card-title {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .moderation-card-hint {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.6;
    }
    .moderation-inline {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .moderation-input {
      width: 110px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font: inherit;
      background: var(--surface);
    }
    .feedback-status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.78rem;
    }
    .feedback-status-badge.ok {
      background: rgba(16, 185, 129, 0.12);
      color: #047857;
    }
    .feedback-status-badge.muted {
      background: rgba(239, 68, 68, 0.12);
      color: #b91c1c;
    }
    .action-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    @media (max-width: 768px) {
      .toolbar-row {
        align-items: stretch;
      }
      .moderation-grid {
        grid-template-columns: 1fr;
      }
      .search-box {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">Class<span>Show</span> · 信息反馈</div>
    <div class="topbar-right">
      <button class="btn btn-sm btn-secondary" onclick="location.href='teacher-dashboard.html'">← 返回后台</button>
      <button class="btn btn-sm btn-secondary" onclick="location.href='teacher-works.html'">📁 作品管理</button>
      <button class="btn btn-sm btn-secondary" onclick="location.href='teacher-scores.html'">📊 评分成绩</button>
      <button class="btn btn-sm btn-secondary" onclick="openDisplay()">🖥 大屏展示</button>
    </div>
  </div>

  <div class="container" style="padding-top:24px;">
    <div class="section-header">
      <div>
        <h2>📝 信息反馈管理</h2>
        <p style="color:var(--text-muted);margin-top:6px;">查看学生在大屏底部实名提交的信息反馈，并可按最新/最热排序或手动删除。</p>
      </div>
      <div class="card-badge" id="feedbackCountBadge">0 条反馈</div>
    </div>

    <div class="feedback-note" id="likesNotice"></div>

    <div class="moderation-grid">
      <div class="card">
        <div class="card-body">
          <div class="moderation-card-title">每日反馈上限</div>
          <div class="moderation-card-hint">限制同一学生在当前活动里当天最多能提交多少条信息反馈。输入 <strong>0</strong> 表示不限制；建议设置在 3-10 条之间。</div>
          <div class="moderation-inline">
            <input id="dailyLimitInput" class="moderation-input" type="number" min="0" max="20" step="1" value="5">
            <button class="btn btn-primary" type="button" onclick="saveDailyLimit()">保存上限</button>
            <span id="dailyLimitStatus" class="moderation-card-hint"></span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="moderation-card-title">反馈禁言说明</div>
          <div class="moderation-card-hint">对某位学生执行“禁言反馈”后，他仍可正常登录、浏览和上传作品，但不能再提交新的信息反馈。已经发出的旧反馈仍可由老师删除。</div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-body">
        <div class="toolbar-row">
          <div class="sort-pills" id="sortPills">
            <button class="sort-pill active" id="sortLatestBtn" type="button" onclick="setSort('latest')">按时间</button>
            <button class="sort-pill" id="sortHotBtn" type="button" onclick="setSort('hot')">按热度</button>
          </div>
          <input id="searchBox" class="search-box" type="text" placeholder="搜索姓名 / 学号 / 反馈内容">
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>点赞</th>
            <th>姓名</th>
            <th>学号</th>
            <th>班级</th>
            <th>小组</th>
            <th>反馈内容</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="8" class="feedback-empty">正在加载反馈...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const act = JSON.parse(sessionStorage.getItem('classshow_activity') || '{}');
    const actId = sessionStorage.getItem('classshow_activity_id');
    const token = sessionStorage.getItem('teacherToken');
    if (!token) location.href = 'teacher-login.html';
    if (!actId) location.href = 'teacher-dashboard.html';

    let activeSort = 'latest';
    let allRows = [];
    let likesEnabled = false;
    let dailyLimit = Number.isInteger(Number(act.feedback_daily_limit)) && Number(act.feedback_daily_limit) >= 0
      ? Number(act.feedback_daily_limit)
      : 5;

    function openDisplay() {
      const code = (act.invite_code || '').trim();
      const url = code ? ('display.html?code=' + encodeURIComponent(code)) : 'display.html';
      window.open(url, '_blank');
    }

    function formatBangkokTime(value) {
      if (!value) return '-';
      return new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Bangkok',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).format(new Date(value));
    }

    function updateSortButtons() {
      document.getElementById('sortLatestBtn').classList.toggle('active', activeSort === 'latest');
      document.getElementById('sortHotBtn').classList.toggle('active', activeSort === 'hot');
      document.getElementById('sortHotBtn').disabled = !likesEnabled;
    }

    function updateNotice() {
      const note = document.getElementById('likesNotice');
      if (likesEnabled) {
        note.style.display = 'none';
        note.textContent = '';
        return;
      }
      note.style.display = 'block';
      note.textContent = '当前数据库还未启用“反馈点赞”表，因此“按热度”暂不可用。请在 Supabase 再运行一次最新 upgrade_v4.sql。';
    }

    function updateDailyLimitUi() {
      document.getElementById('dailyLimitInput').value = dailyLimit;
      document.getElementById('dailyLimitStatus').textContent = dailyLimit > 0
        ? `当前：每位学生每天最多 ${dailyLimit} 条反馈`
        : '当前：不限制每日反馈条数';
    }

    function applySearch(rows) {
      const keyword = String(document.getElementById('searchBox').value || '').trim().toLowerCase();
      if (!keyword) return rows;
      return rows.filter(item => {
        const u = item.users || {};
        return [
          item.content,
          u.name,
          u.student_id,
          u.class_name,
          u.group_name
        ].some(value => String(value || '').toLowerCase().includes(keyword));
      });
    }

    function render(rows = allRows) {
      const tbody = document.getElementById('tbody');
      const filtered = applySearch(rows);
      document.getElementById('feedbackCountBadge').textContent = `${filtered.length} 条反馈`;
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="feedback-empty">暂无符合条件的反馈</td></tr>';
        return;
      }
      tbody.innerHTML = filtered.map(item => {
        const u = item.users || {};
        const muteButton = u.student_id
          ? `<button class="btn btn-sm ${item.feedback_muted ? 'btn-secondary' : 'btn-danger'}" type="button" onclick="toggleFeedbackMute('${encodeURIComponent(u.student_id || '')}', ${item.feedback_muted ? 'false' : 'true'}, '${encodeURIComponent(u.name || '')}')">${item.feedback_muted ? '解除禁言' : '禁言反馈'}</button>`
          : '';
        return `
          <tr>
            <td>${formatBangkokTime(item.created_at)}</td>
            <td><span class="feedback-like-badge">👍 ${item.like_count || 0}</span></td>
            <td>${escapeHtml(u.name || '-')}</td>
            <td>${escapeHtml(u.student_id || '-')}</td>
            <td>${escapeHtml(u.class_name || '-')}</td>
            <td>${escapeHtml(u.group_name || '-')}</td>
            <td>
              <div class="feedback-content">${escapeHtml(item.content || '')}</div>
              <div class="feedback-meta">${activeSort === 'hot' ? '当前按热度排序' : '当前按时间排序'}</div>
            </td>
            <td>
              <div class="action-stack">
                <span class="feedback-status-badge ${item.feedback_muted ? 'muted' : 'ok'}">${item.feedback_muted ? '已禁言反馈' : '反馈正常'}</span>
                ${muteButton}
                <button class="btn btn-sm btn-danger" type="button" onclick="deleteFeedback('${item.id}')">删除反馈</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function loadFeedback() {
      try {
        const result = await api('/teacher/activity-feedback?activity_id=' + encodeURIComponent(actId) + '&sort=' + encodeURIComponent(activeSort));
        likesEnabled = !!result.likes_enabled;
        const nextDailyLimit = Number(result.daily_limit ?? act.feedback_daily_limit);
        dailyLimit = Number.isInteger(nextDailyLimit) && nextDailyLimit >= 0 ? nextDailyLimit : 5;
        act.feedback_daily_limit = dailyLimit;
        sessionStorage.setItem('classshow_activity', JSON.stringify(act));
        allRows = Array.isArray(result.items) ? result.items : [];
        if (activeSort === 'hot' && !likesEnabled) activeSort = 'latest';
        updateSortButtons();
        updateNotice();
        updateDailyLimitUi();
        render(allRows);
      } catch (e) {
        document.getElementById('tbody').innerHTML = `<tr><td colspan="8" class="feedback-empty">加载失败：${escapeHtml(e.message)}</td></tr>`;
      }
    }

    function setSort(sort) {
      const next = sort === 'hot' ? 'hot' : 'latest';
      if (next === 'hot' && !likesEnabled) {
        toast('请先运行最新 upgrade_v4.sql，再启用热度排序', 'error');
        return;
      }
      activeSort = next;
      updateSortButtons();
      loadFeedback();
    }

    async function deleteFeedback(id) {
      if (!confirm('确定删除这条信息反馈吗？删除后不可恢复。')) return;
      try {
        await api('/teacher/activity-feedback/' + encodeURIComponent(id), { method: 'DELETE' });
        toast('信息反馈已删除', 'success');
        await loadFeedback();
      } catch (e) {
        toast('删除失败：' + e.message, 'error');
      }
    }

    async function saveDailyLimit() {
      const value = Number(document.getElementById('dailyLimitInput').value);
      if (!Number.isInteger(value) || value < 0 || value > 20) {
        toast('每日反馈上限需填写 0-20 的整数', 'error');
        return;
      }
      try {
        const updated = await api('/activities/' + encodeURIComponent(actId), {
          method: 'PUT',
          body: JSON.stringify({ feedback_daily_limit: value })
        });
        const savedDailyLimit = Number(updated.feedback_daily_limit ?? value);
        dailyLimit = Number.isInteger(savedDailyLimit) && savedDailyLimit >= 0 ? savedDailyLimit : value;
        act.feedback_daily_limit = dailyLimit;
        sessionStorage.setItem('classshow_activity', JSON.stringify(act));
        updateDailyLimitUi();
        toast('每日反馈上限已更新', 'success');
      } catch (e) {
        toast('保存失败：' + e.message, 'error');
      }
    }

    async function toggleFeedbackMute(studentId, nextMuted, studentName = '') {
      studentId = decodeURIComponent(studentId || '');
      studentName = decodeURIComponent(studentName || '');
      const actionText = nextMuted ? '禁言反馈' : '解除禁言';
      const targetLabel = studentName ? `${studentName}（${studentId}）` : studentId;
      if (!confirm(`确定要对 ${targetLabel} 执行“${actionText}”吗？`)) return;
      try {
        await api('/teacher/activity-feedback-moderation', {
          method: 'PUT',
          body: JSON.stringify({
            activity_id: actId,
            student_id: studentId,
            feedback_muted: nextMuted
          })
        });
        toast(`已${actionText}`, 'success');
        await loadFeedback();
      } catch (e) {
        toast(`${actionText}失败：` + e.message, 'error');
      }
    }

    document.getElementById('searchBox').addEventListener('input', () => render(allRows));
    updateSortButtons();
    updateDailyLimitUi();
    loadFeedback();
  </script>
</body>
</html>
