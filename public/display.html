<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大屏展示 - ClassShow</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* Spotlight Modal - Full Screen Work Detail */
    .spotlight-overlay {
      position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.92);
      backdrop-filter: blur(20px); display: none; opacity: 0;
      transition: opacity 0.4s ease;
    }
    .spotlight-overlay.active { display: flex; opacity: 1; }
    .spotlight-layout {
      display: flex; width: 100%; height: 100%; padding: 40px;
      gap: 40px; align-items: center; justify-content: center;
    }
    .spotlight-img-wrap {
      flex: 1; max-width: 60%; height: 100%; display: flex;
      align-items: center; justify-content: center;
    }
    .spotlight-img-wrap img {
      max-width: 100%; max-height: 85vh; object-fit: contain;
      border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: spotlightZoom 0.5s ease forwards;
    }
    @keyframes spotlightZoom {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .spotlight-info {
      width: 380px; max-height: 85vh; overflow-y: auto;
      background: rgba(30, 41, 59, 0.95); border-radius: 20px;
      padding: 32px; border: 1px solid rgba(99, 102, 241, 0.25);
      animation: spotlightSlide 0.5s ease forwards;
    }
    @keyframes spotlightSlide {
      from { transform: translateX(30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .spotlight-badge { display: inline-block; padding: 4px 14px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; background: rgba(99,102,241,0.2); color: #818cf8; margin-bottom: 12px; }
    .spotlight-title { font-size: 1.6rem; font-weight: 800; color: #f1f5f9; margin-bottom: 8px; }
    .spotlight-desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }
    .spotlight-stats { display: flex; gap: 24px; margin-bottom: 24px; }
    .spotlight-stat { text-align: center; }
    .spotlight-stat-val { font-size: 1.8rem; font-weight: 800; color: #818cf8; }
    .spotlight-stat-lbl { font-size: 0.75rem; color: #64748b; margin-top: 2px; }
    .spotlight-stars { display: flex; gap: 6px; margin-bottom: 24px; justify-content: center; }
    .spotlight-star { font-size: 2rem; color: #334155; }
    .spotlight-star.filled { color: #f59e0b; }
    .spotlight-comments-title { font-size: 1rem; font-weight: 700; color: #94a3b8; margin-bottom: 12px; border-top: 1px solid rgba(148,163,184,0.15); padding-top: 16px; }
    .spotlight-comment { padding: 12px; background: rgba(15,23,42,0.6); border-radius: 12px; margin-bottom: 10px; }
    .spotlight-comment-text { color: #e2e8f0; font-size: 0.9rem; line-height: 1.5; }
    .spotlight-comment-time { color: #475569; font-size: 0.75rem; margin-top: 6px; }
    .spotlight-empty { color: #475569; text-align: center; padding: 20px; font-size: 0.9rem; }
    .spotlight-action-box { margin-bottom: 20px; padding: 16px; border-radius: 16px; background: rgba(15,23,42,0.72); border: 1px solid rgba(99,102,241,0.2); }
    .spotlight-action-title { font-size: 0.95rem; font-weight: 800; color: #e2e8f0; margin-bottom: 10px; }
    .spotlight-action-hint { color: #94a3b8; font-size: 0.88rem; line-height: 1.6; }
    .spotlight-link-btn { display:inline-flex; align-items:center; justify-content:center; margin-top:10px; padding:8px 12px; border-radius:10px; text-decoration:none; font-size:0.85rem; font-weight:700; background:#6366f1; color:#fff; }
    .spotlight-rate-row { display:flex; gap:6px; justify-content:center; margin-bottom:8px; flex-wrap:wrap; }
    .spotlight-rate-star-btn { background:none; border:none; color:#334155; font-size:2rem; cursor:pointer; transition:transform 0.15s ease,color 0.15s ease; padding:0; line-height:1; }
    .spotlight-rate-star-btn.active, .spotlight-rate-star-btn:hover { color:#f59e0b; transform:scale(1.06); }
    .spotlight-rate-hint { text-align:center; color:#94a3b8; font-size:0.82rem; margin-bottom:14px; }
    .spotlight-comment-compose { display:flex; gap:10px; margin-top:12px; }
    .spotlight-comment-compose input { flex:1; min-width:0; background:rgba(255,255,255,0.08); border:1px solid rgba(148,163,184,0.2); border-radius:12px; color:#f8fafc; padding:10px 12px; }
    .spotlight-comment-compose input::placeholder { color:#64748b; }
    .spotlight-open-detail { margin-top:14px; width:100%; }
    .feedback-panel { margin-top: 28px; margin-bottom: 48px; padding: 24px; border-radius: 20px; background: rgba(15,23,42,0.72); border: 1px solid rgba(148,163,184,0.18); }
    .feedback-panel-header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:16px; }
    .feedback-panel-title { font-size:1.2rem; font-weight:800; color:#f8fafc; }
    .feedback-panel-subtitle { font-size:0.9rem; color:#94a3b8; margin-top:6px; }
    .feedback-panel-note { color:#64748b; font-size:0.82rem; white-space:nowrap; }
    .feedback-panel-tools { display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
    .feedback-sort { display:inline-flex; gap:8px; padding:4px; border-radius:999px; background:rgba(15,23,42,0.72); border:1px solid rgba(148,163,184,0.18); }
    .feedback-sort-btn { border:none; background:transparent; color:#94a3b8; padding:8px 14px; border-radius:999px; cursor:pointer; font:inherit; font-weight:700; transition:all 0.2s ease; }
    .feedback-sort-btn.active { background:#6366f1; color:#ffffff; box-shadow:0 10px 24px rgba(99,102,241,0.22); }
    .feedback-sort-btn:disabled { opacity:0.45; cursor:not-allowed; box-shadow:none; }
    .feedback-compose { display:flex; gap:12px; margin-bottom:18px; align-items:flex-start; }
    .feedback-compose textarea { flex:1; min-height:92px; resize:vertical; background:rgba(255,255,255,0.08); border:1px solid rgba(148,163,184,0.22); border-radius:16px; color:#f8fafc; padding:14px 16px; font-family:inherit; font-size:0.95rem; line-height:1.6; }
    .feedback-compose textarea::placeholder { color:#64748b; }
    .feedback-compose-side { width:132px; display:flex; flex-direction:column; gap:8px; }
    .feedback-compose-hint { color:#94a3b8; font-size:0.8rem; line-height:1.5; }
    .feedback-guest-box { padding:14px 16px; border-radius:14px; background:rgba(30,41,59,0.6); color:#94a3b8; font-size:0.88rem; margin-bottom:18px; }
    .feedback-upgrade-note { margin-bottom:16px; padding:12px 14px; border-radius:14px; background:rgba(245,158,11,0.14); color:#fcd34d; font-size:0.84rem; line-height:1.6; }
    .feedback-list { display:flex; flex-direction:column; gap:12px; }
    .feedback-item { padding:14px 16px; border-radius:16px; background:rgba(15,23,42,0.58); border:1px solid rgba(99,102,241,0.14); }
    .feedback-item-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:8px; }
    .feedback-item-label { display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; background:rgba(99,102,241,0.14); color:#a5b4fc; font-size:0.78rem; font-weight:700; }
    .feedback-item-time { color:#64748b; font-size:0.78rem; }
    .feedback-item-author { color:#f8fafc; font-size:0.92rem; font-weight:700; }
    .feedback-item-author-sub { color:#94a3b8; font-size:0.8rem; margin-top:4px; }
    .feedback-item-text { color:#e2e8f0; font-size:0.94rem; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
    .feedback-item-foot { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; }
    .feedback-item-meta { color:#64748b; font-size:0.78rem; }
    .feedback-like-btn { display:inline-flex; align-items:center; gap:6px; border:none; background:rgba(255,255,255,0.06); color:#cbd5e1; padding:7px 12px; border-radius:999px; cursor:pointer; font:inherit; font-size:0.82rem; font-weight:700; transition:all 0.2s ease; }
    .feedback-like-btn:hover:not(:disabled) { transform:translateY(-1px); background:rgba(99,102,241,0.18); color:#e0e7ff; }
    .feedback-like-btn.active { background:rgba(99,102,241,0.2); color:#c7d2fe; }
    .feedback-like-btn:disabled { opacity:0.55; cursor:not-allowed; }
    .spotlight-close {
      position: fixed; top: 24px; right: 32px; z-index: 600;
      background: rgba(255,255,255,0.15); border: none; color: #f1f5f9;
      width: 48px; height: 48px; border-radius: 50%; font-size: 1.5rem;
      cursor: pointer; transition: background 0.2s; display: none;
    }
    .spotlight-close:hover { background: rgba(255,255,255,0.3); }
    .spotlight-overlay.active ~ .spotlight-close { display: flex; align-items: center; justify-content: center; }
    @media (max-width: 900px) {
      .spotlight-layout { flex-direction: column; padding: 20px; }
      .spotlight-img-wrap { max-width: 100%; }
      .spotlight-info { width: 100%; max-height: 40vh; }
      .feedback-panel-header { align-items:flex-start; }
      .feedback-panel-tools { width:100%; align-items:flex-start; }
      .feedback-compose { flex-direction: column; }
      .feedback-compose-side { width: 100%; }
      .feedback-item-foot { flex-direction:column; align-items:flex-start; }
    }
    /* ─── Top-3 Hero Showcase ─── */
    .top3-hero { position:relative; width:100%; height:420px; overflow:hidden; border-radius:20px; margin:20px 0 8px; box-shadow:0 8px 40px rgba(0,0,0,0.6); }
    .top3-slide { position:absolute; inset:0; opacity:0; transition:opacity 0.8s ease, transform 0.8s ease; transform:scale(1.04); pointer-events:none; z-index:1; }
    .top3-slide.active { opacity:1; transform:scale(1); pointer-events:auto; z-index:2; }
    .top3-slide img, .top3-slide video { width:100%; height:100%; object-fit:cover; display:block; }
    .top3-slide video { pointer-events:none; }
    .top3-overlay { position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 55%, transparent 100%); }
    .top3-content { position:absolute; bottom:0; left:0; right:0; padding:28px 36px; }
    .top3-medal { display:inline-flex; align-items:center; gap:8px; margin-bottom:10px; }
    .top3-medal-icon { font-size:2rem; line-height:1; }
    .top3-rank-badge { background:rgba(255,255,255,0.15); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.25); color:#fff; padding:4px 14px; border-radius:999px; font-size:0.85rem; font-weight:700; }
    .top3-title { font-size:2rem; font-weight:900; color:#fff; line-height:1.2; margin-bottom:10px; text-shadow:0 2px 12px rgba(0,0,0,0.5); }
    .top3-meta { display:flex; gap:16px; color:rgba(255,255,255,0.8); font-size:0.95rem; }
    .top3-meta span { display:flex; align-items:center; gap:5px; }
    .top3-dots { position:absolute; top:18px; right:24px; display:flex; gap:8px; z-index:10; }
    .top3-dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.35); transition:all 0.3s; cursor:pointer; }
    .top3-dot.active { background:#fff; transform:scale(1.3); }
    .top3-score { position:absolute; top:20px; left:24px; background:rgba(245,158,11,0.9); backdrop-filter:blur(8px); color:#fff; font-size:1.5rem; font-weight:900; padding:8px 20px; border-radius:12px; box-shadow:0 4px 16px rgba(245,158,11,0.4); }
  </style>
</head>
<body class="display-mode">
  <div class="display-header">
    <h1 id="displayTitle">课堂作品秀</h1>
    <p id="displaySubtitle">加载中...</p>
  </div>
  
  <!-- Floating QR Code -->
  <div class="display-qr" id="qrContainer" style="display:none;">
    <img id="qrImg" src="" alt="扫码加入">
    <span>扫码加入课堂</span>
  </div>

  <div class="display-stats">
    <div class="display-stat"><div class="display-stat-value" id="dSubs">0</div><div class="display-stat-label">作品数量</div></div>
    <div class="display-stat"><div class="display-stat-value" id="dUsers">0</div><div class="display-stat-label">参与学生</div></div>
    <div class="display-stat"><div class="display-stat-value" id="dRatings">0</div><div class="display-stat-label">评分次数</div></div>
    <div class="display-stat">
      <div class="display-stat-value" id="dStatus">⏳</div>
      <div class="display-stat-label" id="dStatusLabel">准备中</div>
    </div>
  </div>

  <!-- New Works -->
  <div class="container" id="newSection" style="display:none;">
    <div class="section-header" style="margin-top:16px;">
      <h3 class="section-title" style="color:#f1f5f9;">🔥 新作品（5分钟内）</h3>
    </div>
    <div class="display-carousel" id="newCarousel"></div>
  </div>

  <!-- All Works Carousel -->
  <div class="container">
    <!-- Top-3 Hero (shown when rankings available) -->
    <div id="top3Section" style="display:none;">
      <div class="section-header" style="margin-top:16px;">
        <h3 class="section-title" style="color:#f1f5f9;">🏅 优秀作品展示</h3>
      </div>
      <div class="top3-hero" id="top3Hero">
        <!-- slides injected by JS -->
        <div class="top3-dots" id="top3Dots"></div>
      </div>
    </div>

    <div class="section-header" style="margin-top:16px;">
      <h3 class="section-title" style="color:#f1f5f9;">🎨 作品展示</h3>
    </div>
    <div class="display-carousel" id="allCarousel"></div>
  </div>

  <!-- Rankings -->
  <div class="container" id="rankSection" style="display:none;">
    <div class="section-header" style="margin-top:24px;">
      <h3 class="section-title" style="color:#f1f5f9;">🏆 排行榜</h3>
    </div>
    <div class="display-ranking" id="rankList"></div>
  </div>

  <div class="container">
    <div class="feedback-panel" id="feedbackSection">
      <div class="feedback-panel-header">
        <div>
          <div class="feedback-panel-title">📝 信息反馈</div>
          <div class="feedback-panel-subtitle">同学们可以在这里实名留言，反馈对大屏页面、展示节奏、交互方式等的意见，便于老师直接核对和跟进。</div>
        </div>
        <div class="feedback-panel-tools">
          <div class="feedback-sort">
            <button class="feedback-sort-btn active" id="feedbackSortLatest" type="button" onclick="setFeedbackSort('latest')">按时间</button>
            <button class="feedback-sort-btn" id="feedbackSortHot" type="button" onclick="setFeedbackSort('hot')">按热度</button>
          </div>
          <div class="feedback-panel-note" id="feedbackPanelNote">最新 50 条实名反馈</div>
        </div>
      </div>
      <div id="feedbackComposer"></div>
      <div class="feedback-list" id="feedbackList">
        <div class="spotlight-empty">暂无信息反馈，欢迎留下第一条实名反馈。</div>
      </div>
    </div>
  </div>

  <!-- Spotlight Full-Screen Modal -->
  <div class="spotlight-overlay" id="spotlightOverlay" onclick="closeSpotlight(event)">
    <div class="spotlight-layout">
      <div class="spotlight-img-wrap">
        <div id="spotMediaWrap" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;"></div>
      </div>
      <div class="spotlight-info" onclick="event.stopPropagation()">
        <div id="spotBadge" class="spotlight-badge"></div>
        <div id="spotTitle" class="spotlight-title"></div>
        <div id="spotDesc" class="spotlight-desc"></div>
        <div class="spotlight-stats">
          <div class="spotlight-stat"><div class="spotlight-stat-val" id="spotAvg">-</div><div class="spotlight-stat-lbl">平均分</div></div>
          <div class="spotlight-stat"><div class="spotlight-stat-val" id="spotViews">0</div><div class="spotlight-stat-lbl">浏览量</div></div>
          <div class="spotlight-stat"><div class="spotlight-stat-val" id="spotCommentsCount">0</div><div class="spotlight-stat-lbl">评论数</div></div>
          <div class="spotlight-stat"><div class="spotlight-stat-val" id="spotRaters">0</div><div class="spotlight-stat-lbl">评分人数</div></div>
        </div>
        <div class="spotlight-stars" id="spotStars"></div>
        <div id="spotActionBox" class="spotlight-action-box"></div>
        <div class="spotlight-comments-title">💬 匿名评价</div>
        <div id="spotComments"><div class="spotlight-empty">暂无评价</div></div>
      </div>
    </div>
  </div>
  <button class="spotlight-close" id="spotlightClose" onclick="closeSpotlight()">✕</button>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    let actId = sessionStorage.getItem('classshow_activity_id');
    let act = JSON.parse(sessionStorage.getItem('classshow_activity') || '{}');
    const codeFromUrl = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
    const viewerUser = getSession();
    const viewerIsGuest = isGuest();
    const teacherMode = !!sessionStorage.getItem('teacherToken') && !viewerUser;
    let activeSpotlightWork = null;
    let activeSpotlightMyRating = 0;
    let spotlightViewTimer = null;
    let activeFeedbackSort = 'latest';
    let feedbackLikesEnabled = false;
    const DISPLAY_NEW_WORK_WINDOW_MS = 10 * 60 * 1000;
    const DISPLAY_NEW_WORK_LABEL_MINUTES = 10;
    const DISPLAY_CAROUSEL_SCROLL_MS = 60 * 1000;
    const DISPLAY_CAROUSEL_SCROLL_STEP = 260;

    function updateDisplayHeader() {
      document.getElementById('displayTitle').textContent = act.activity_name || '课堂作品秀';
      document.getElementById('displaySubtitle').textContent = (act.course_name || '') + ' · ' + (act.class_name || '');
      const newTitle = document.querySelector('#newSection .section-title');
      if (newTitle) newTitle.textContent = `🔥 新作品（${DISPLAY_NEW_WORK_LABEL_MINUTES}分钟内）`;
    }

    function isDisplayNewWork(dateStr) {
      return (Date.now() - new Date(dateStr).getTime()) < DISPLAY_NEW_WORK_WINDOW_MS;
    }

    async function resolveActivityContext() {
      if (codeFromUrl) {
        try {
          const activity = await api('/activities/code/' + encodeURIComponent(codeFromUrl));
          act = activity || {};
          actId = activity?.id || actId;
          if (actId) setActivityId(actId);
          sessionStorage.setItem('classshow_activity', JSON.stringify(act));
        } catch (e) {
          document.querySelector('.display-header p').textContent = '邀请码无效，无法打开大屏展示';
          return false;
        }
      }

      if (!actId && act?.id) {
        actId = act.id;
        setActivityId(actId);
      }

      if (!actId) {
        document.querySelector('.display-header p').textContent = '请从教师后台进入，或使用 display.html?code=邀请码 打开大屏';
        return false;
      }

      updateDisplayHeader();
      renderFeedbackComposer();
      updateFeedbackSortUi();
      return true;
    }

    async function refresh() {
      if (!actId) return;
      try {
        const inviteCode = (act && act.invite_code) ? act.invite_code : codeFromUrl;
        const actInfoPromise = inviteCode
          ? api('/activities/code/' + encodeURIComponent(inviteCode))
          : Promise.resolve({ upload_open: false, voting_open: false, show_live_ranking: false, comments_open: false });

        const [works, stats, actInfo] = await Promise.all([
          api('/submissions?activity_id=' + actId),
          api('/activities/' + actId + '/stats'),
          actInfoPromise
        ]);
        if (actInfo?.invite_code) {
          act = { ...act, ...actInfo };
          sessionStorage.setItem('classshow_activity', JSON.stringify(act));
          updateDisplayHeader();
        }
        loadDisplayFeedback();

        // Load QR once
        if (document.getElementById('qrContainer').style.display === 'none' && (act && act.invite_code)) {
          const url = location.origin + '/index.html?code=' + act.invite_code;
          api('/qrcode?text=' + encodeURIComponent(url)).then(res => {
            if (res.url) {
              document.getElementById('qrImg').src = res.url;
              document.getElementById('qrContainer').style.display = 'flex';
            }
          });
        }
        document.getElementById('dSubs').textContent = stats.submissions;
        document.getElementById('dUsers').textContent = stats.users;
        document.getElementById('dRatings').textContent = stats.ratings;

        // Status
        if (actInfo.voting_open) {
          document.getElementById('dStatus').textContent = '🟢';
          document.getElementById('dStatusLabel').textContent = '评分进行中';
        } else if (actInfo.upload_open) {
          document.getElementById('dStatus').textContent = '📤';
          document.getElementById('dStatusLabel').textContent = '上传进行中';
        } else {
          document.getElementById('dStatus').textContent = '🔒';
          document.getElementById('dStatusLabel').textContent = '已结束';
        }

        // New works (< configured minutes for display)
        const newWorks = works.filter(w => isDisplayNewWork(w.upload_time));
        if (newWorks.length > 0) {
          document.getElementById('newSection').style.display = 'block';
          document.getElementById('newCarousel').innerHTML = newWorks.map(w => {
            const remaining = Math.max(0, Math.ceil((DISPLAY_NEW_WORK_WINDOW_MS - (Date.now() - new Date(w.upload_time).getTime())) / 1000));
            const mm = Math.floor(remaining / 60); const ss = remaining % 60;
            const vid = isVideo(w.image_url);
            return `<div class="display-card" style="cursor:pointer" onclick="openSpotlight('${w.id}')">
              ${vid
                ? `<video src="${w.image_url}" muted playsinline preload="metadata" style="width:100%;height:220px;object-fit:cover;display:block;" oncanplay="startFiveSecPreview(this)"></video>`
                : `<img src="${w.image_url}" alt="">`}
              <div class="display-card-body">
                <span class="card-badge new">${w.anonymous_code}</span>
                <span class="display-countdown">⏱ ${mm}:${String(ss).padStart(2,'0')}</span>
                <div class="display-card-title" style="margin-top:8px;">${w.title}</div>
              </div>
            </div>`;
          }).join('');
        } else { document.getElementById('newSection').style.display = 'none'; }

        // All works
        const selected = works.filter(w => w.is_teacher_selected);
        const display = selected.length > 0 ? selected : works;
        document.getElementById('allCarousel').innerHTML = display.map(w => {
          const vid = isVideo(w.image_url);
          return `<div class="display-card" style="cursor:pointer" onclick="openSpotlight('${w.id}')">
            ${vid
              ? `<video src="${w.image_url}" muted playsinline preload="metadata" style="width:100%;height:220px;object-fit:cover;display:block;" oncanplay="startFiveSecPreview(this)"></video>`
              : `<img src="${w.image_url}" alt="">`}
            <div class="display-card-body">
              <span class="card-badge">${w.anonymous_code}</span>
              ${w.is_teacher_selected ? '<span class="card-badge" style="background:#fef3c7;color:#b45309;">⭐ 精选</span>' : ''}
              ${vid ? '<span class="card-badge" style="background:#e0e7ff;color:#4338ca;">🎥 视频</span>' : ''}
              <div class="display-card-title" style="margin-top:8px;">${w.title}</div>
              <div class="card-meta"><span>👁 ${w.view_count}</span><span>💬 ${w.comment_count || 0}</span><span>⭐ ${w.average_rating > 0 ? Number(w.average_rating).toFixed(1) : '-'}</span><span>👥 ${w.rating_count}</span></div>
            </div>
          </div>`;
        }).join('');

        // Rankings (show when voting is closed or show_live_ranking is true)
        if (!actInfo.voting_open || actInfo.show_live_ranking) {
          const ranked = [...works].sort((a, b) => b.average_rating - a.average_rating || b.rating_count - a.rating_count);
          const top = ranked.slice(0, 10);
          if (top.length > 0) {
            const rankSec = document.getElementById('rankSection');
            if (rankSec.style.display === 'none') {
              // Just opened ranking! Fire confetti!
              confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            }
            rankSec.style.display = 'block';
            document.getElementById('rankList').innerHTML = top.map((w, i) => {
              const vid = isVideo(w.image_url);
              // Video thumbnail: use <video> with preload="metadata" — browser renders first frame automatically
              const thumb = vid
                ? `<video class="display-rank-img" src="${w.image_url}" preload="metadata" muted playsinline
                     style="object-fit:cover;" onloadedmetadata="this.currentTime=0.001"></video>`
                : `<img class="display-rank-img" src="${w.image_url}" alt="">`;
            return `<div class="display-rank-item" style="cursor:pointer;" onclick="openSpotlight('${w.id}')">
                <span class="rank-badge ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${i+1}</span>
                ${thumb}
                <div class="display-rank-info">
                  <div class="display-rank-title">${w.anonymous_code} · ${w.title}${vid ? ' <span style="font-size:0.75rem;opacity:0.7;">🎬</span>' : ''}</div>
                  <div class="card-meta"><span>👁 ${w.view_count}</span><span>💬 ${w.comment_count || 0}</span><span>👥 ${w.rating_count}人评</span></div>
                </div>
                <div class="display-rank-score">${w.average_rating > 0 ? Number(w.average_rating).toFixed(1) : '-'}</div>
              </div>`;
            }).join('');
            // Build Top-3 hero above carousel (inside top.length>0)
            buildTop3Hero(top.slice(0, 3));
          }
        } else {
          document.getElementById('rankSection').style.display = 'none';
          document.getElementById('top3Section').style.display = 'none';
        }
      } catch (e) { console.error(e); }
    }
    (async () => {
      const ok = await resolveActivityContext();
      if (!ok) return;
      refresh();
      setInterval(refresh, 8000);
    })();

    // Auto-scroll carousel
    setInterval(() => {
      // Pause auto-scroll when spotlight is open
      if (document.getElementById('spotlightOverlay').classList.contains('active')) return;
      document.querySelectorAll('.display-carousel').forEach(c => {
        if (c.scrollWidth > c.clientWidth) {
          c.scrollLeft += DISPLAY_CAROUSEL_SCROLL_STEP;
          if (c.scrollLeft >= c.scrollWidth - c.clientWidth) c.scrollLeft = 0;
        }
      });
    }, DISPLAY_CAROUSEL_SCROLL_MS);

    // ─── Top-3 Hero Showcase ───
    let top3Timer = null;
    let top3Index = 0;
    let top3Works = [];
    const TOP3_ROTATION_MS = 10 * 1000;

    function buildTop3Hero(works) {
      if (!works || works.length === 0) return;
      // Only rebuild slides if data changed
      const hero = document.getElementById('top3Hero');
      const newIds = works.map(w => w.id).join(',');
      if (hero.dataset.ids === newIds) return; // No change
      hero.dataset.ids = newIds;
      top3Works = works;
      top3Index = 0;

      const medals = ['🥇', '🥈', '🥉'];
      const medalColors = ['#f59e0b', '#94a3b8', '#b45309'];

      // Build slides
      const slidesHtml = works.map((w, i) => {
        const vid = isVideo(w.image_url);
        const media = vid
          ? `<video src="${w.image_url}" muted playsinline preload="metadata" onloadedmetadata="this.currentTime=0.001" style="width:100%;height:100%;object-fit:cover;display:block;"></video>`
          : `<img src="${w.image_url}" alt="${w.title}" style="width:100%;height:100%;object-fit:cover;display:block;">`;
        return `
          <div class="top3-slide ${i === 0 ? 'active' : ''}" data-idx="${i}" onclick="openSpotlight('${w.id}')" style="cursor:pointer">
            ${media}
            <div class="top3-overlay"></div>
            <div class="top3-score">${w.average_rating > 0 ? '★ ' + Number(w.average_rating).toFixed(1) : '★ -'}</div>
            <div class="top3-content">
              <div class="top3-medal">
                <span class="top3-medal-icon">${medals[i]}</span>
                <span class="top3-rank-badge" style="border-color:${medalColors[i]}40;color:${medalColors[i]};background:${medalColors[i]}20;">第 ${i+1} 名</span>
                <span class="top3-rank-badge">${w.anonymous_code}</span>
                ${vid ? '<span class="top3-rank-badge">🎥 视频</span>' : ''}
              </div>
              <div class="top3-title">${w.title}</div>
              <div class="top3-meta">
                <span>👁 ${w.view_count} 浏览</span>
                <span>💬 ${w.comment_count || 0} 评论</span>
                <span>👥 ${w.rating_count} 人评分</span>
              </div>
            </div>
          </div>`;
      }).join('');

      // Build dots
      const dotsHtml = works.map((_, i) =>
        `<div class="top3-dot ${i === 0 ? 'active' : ''}" onclick="showTop3Slide(${i})"></div>`
      ).join('');

      // Keep dots div, replace rest
      document.getElementById('top3Dots').innerHTML = dotsHtml;
      // Remove old slides (keep dots div)
      hero.querySelectorAll('.top3-slide').forEach(el => el.remove());
      hero.insertAdjacentHTML('afterbegin', slidesHtml);

      document.getElementById('top3Section').style.display = 'block';

      // Start / restart 10-second rotation
      if (top3Timer) clearInterval(top3Timer);
      top3Timer = setInterval(() => {
        top3Index = (top3Index + 1) % top3Works.length;
        showTop3Slide(top3Index);
      }, TOP3_ROTATION_MS);
    }

    function showTop3Slide(idx) {
      top3Index = idx;
      document.querySelectorAll('.top3-slide').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });
      document.querySelectorAll('.top3-dot').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });
    }

    // ─── 5-Second Preview Helper ───
    function startFiveSecPreview(vid) {
      if (vid._previewSetup) return;
      vid._previewSetup = true;
      vid.play().catch(() => {});
      vid.addEventListener('timeupdate', () => {
        if (vid.currentTime >= 5) { vid.currentTime = 0; vid.play().catch(() => {}); }
      });
    }

    // ─── Spotlight Functions ───
    async function openSpotlight(submissionId) {
      const overlay = document.getElementById('spotlightOverlay');
      try {
        clearTimeout(spotlightViewTimer);
        const qs = viewerUser?.id ? ('?viewer_user_id=' + encodeURIComponent(viewerUser.id)) : '';
        // Fetch submission detail
        const work = await api('/submissions/' + submissionId + qs);
        activeSpotlightWork = work;
        activeSpotlightMyRating = 0;
        // Render media: video or image
        const spotMediaWrap = document.getElementById('spotMediaWrap');
        if (isVideo(work.image_url)) {
          spotMediaWrap.innerHTML = `<video src="${work.image_url}" controls autoplay muted playsinline
            style="max-width:100%;max-height:85vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.5);display:block;" oncanplay="this.muted=false"></video>`;
        } else {
          spotMediaWrap.innerHTML = `<img src="${work.image_url}" style="max-width:100%;max-height:85vh;object-fit:contain;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.5);animation:spotlightZoom 0.5s ease forwards;">` ;
        }
        document.getElementById('spotBadge').textContent = work.anonymous_code;
        document.getElementById('spotTitle').textContent = work.title;
        document.getElementById('spotDesc').textContent = work.description || '';
        document.getElementById('spotAvg').textContent = work.average_rating > 0 ? Number(work.average_rating).toFixed(1) : '-';
        document.getElementById('spotViews').textContent = work.view_count;
        document.getElementById('spotCommentsCount').textContent = work.comment_count || 0;
        document.getElementById('spotRaters').textContent = work.rating_count;

        // Render star visualization
        const rating = Math.round(work.average_rating || 0);
        document.getElementById('spotStars').innerHTML = [1,2,3,4,5].map(i =>
          `<span class="spotlight-star ${i <= rating ? 'filled' : ''}">★</span>`
        ).join('');

        // Load comments
        await loadSpotlightComments(submissionId);
        await renderSpotlightActions(work);

        if (viewerUser?.id && !work.is_owner) {
          spotlightViewTimer = setTimeout(() => {
            api('/views', {
              method: 'POST',
              body: JSON.stringify({
                activity_id: actId,
                submission_id: submissionId,
                viewer_user_id: viewerUser.id
              })
            }).catch(() => {});
          }, 3000);
        }

        // Show overlay with animation
        overlay.style.display = 'flex';
        requestAnimationFrame(() => overlay.classList.add('active'));
        document.getElementById('spotlightClose').style.display = 'flex';

        // ESC to close
        document.addEventListener('keydown', handleEsc);
      } catch (e) {
        console.error('Spotlight load error:', e);
      }
    }

    function closeSpotlight(event) {
      if (event && event.target !== event.currentTarget) return;
      const overlay = document.getElementById('spotlightOverlay');
      clearTimeout(spotlightViewTimer);
      activeSpotlightWork = null;
      activeSpotlightMyRating = 0;
      overlay.classList.remove('active');
      document.getElementById('spotlightClose').style.display = 'none';
      // Stop any playing video
      document.querySelectorAll('#spotMediaWrap video').forEach(v => { v.pause(); v.src = ''; });
      setTimeout(() => { overlay.style.display = 'none'; }, 400);
      document.removeEventListener('keydown', handleEsc);
    }

    function handleEsc(e) {
      if (e.key === 'Escape') closeSpotlight();
    }

    function updateFeedbackSortUi() {
      const latestBtn = document.getElementById('feedbackSortLatest');
      const hotBtn = document.getElementById('feedbackSortHot');
      const note = document.getElementById('feedbackPanelNote');
      if (latestBtn) latestBtn.classList.toggle('active', activeFeedbackSort === 'latest');
      if (hotBtn) {
        hotBtn.classList.toggle('active', activeFeedbackSort === 'hot');
        hotBtn.disabled = !feedbackLikesEnabled;
      }
      if (note) {
        if (feedbackLikesEnabled) {
          note.textContent = activeFeedbackSort === 'hot'
            ? '按热度查看 · 学生可点赞实名反馈'
            : '最新 50 条实名反馈';
        } else {
          note.textContent = '已按时间显示 · 点赞/热度需运行最新 upgrade_v4.sql';
        }
      }
    }

    function renderFeedbackComposer() {
      const container = document.getElementById('feedbackComposer');
      const loginUrl = 'index.html' + ((act && act.invite_code) ? ('?code=' + encodeURIComponent(act.invite_code)) : '');
      if (teacherMode) {
        container.innerHTML = '<div class="feedback-guest-box">当前是教师展示模式。学生登录后可以在此实名提交信息反馈，老师可直接按姓名和学号核对。</div>';
        return;
      }
      if (!viewerUser || viewerIsGuest) {
        container.innerHTML = `<div class="feedback-guest-box">登录学生账号后，可在这里实名提交信息反馈。反馈会显示你的姓名和学号，便于老师核对。<a class="spotlight-link-btn" style="margin-top:10px;" href="${loginUrl}">去登录学生账号</a></div>`;
        return;
      }
      container.innerHTML = `
        <div class="feedback-compose">
          <textarea id="displayFeedbackInput" maxlength="300" placeholder="例如：优秀作品展示切换可以更慢一点；排行榜可以加作品缩略图；评论区字体可以再大一点……"></textarea>
          <div class="feedback-compose-side">
            <button class="btn btn-primary" type="button" onclick="postDisplayFeedback()">提交反馈</button>
            <div class="feedback-compose-hint">反馈会实名展示你的姓名和学号。每 60 秒最多 1 条，重复内容和无意义内容会被拦截。</div>
          </div>
        </div>
      `;
    }

    function setFeedbackSort(sort) {
      const nextSort = sort === 'hot' ? 'hot' : 'latest';
      if (nextSort === 'hot' && !feedbackLikesEnabled) {
        toast('请先运行最新 upgrade_v4.sql，再启用点赞与热度排序', 'error');
        return;
      }
      activeFeedbackSort = nextSort;
      updateFeedbackSortUi();
      loadDisplayFeedback();
    }

    function renderDisplayFeedbackList(items) {
      const box = document.getElementById('feedbackList');
      if (!items.length) {
        box.innerHTML = '<div class="spotlight-empty">暂无信息反馈，欢迎留下第一条实名反馈。</div>';
        return;
      }
      box.innerHTML = items.map(item => {
        const isOwn = !!viewerUser?.id && String(item.user_id || '') === String(viewerUser.id);
        const canLike = feedbackLikesEnabled && !!viewerUser?.id && !viewerIsGuest && !teacherMode && !isOwn;
        const userInfo = item.users || {};
        const authorName = userInfo.name || '未实名学生';
        const authorSub = [userInfo.student_id, userInfo.class_name].filter(Boolean).join(' · ');
        const likeButton = feedbackLikesEnabled
          ? `<button class="feedback-like-btn ${item.liked_by_me ? 'active' : ''}" ${canLike ? `onclick="toggleDisplayFeedbackLike('${item.id}')"` : 'disabled'}>${item.liked_by_me ? '👍 已点赞' : '👍 点赞'} <span>${item.like_count || 0}</span></button>`
          : '';
        return `
          <div class="feedback-item">
            <div class="feedback-item-head">
              <span class="feedback-item-label">实名反馈</span>
              <span class="feedback-item-time">${timeAgo(item.created_at)}</span>
            </div>
            <div class="feedback-item-author">${escapeHtml(authorName)}</div>
            <div class="feedback-item-author-sub">${escapeHtml(authorSub || '已实名登记')}</div>
            <div class="feedback-item-text">${escapeHtml(item.content || '')}</div>
            <div class="feedback-item-foot">
              <div class="feedback-item-meta">${isOwn ? '这是你实名提交的反馈' : '实名反馈，老师可直接核对并跟进'}</div>
              ${likeButton}
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadDisplayFeedback() {
      try {
        const params = new URLSearchParams({
          activity_id: actId,
          sort: activeFeedbackSort
        });
        if (viewerUser?.id && !viewerIsGuest) {
          params.set('user_id', viewerUser.id);
        }
        const result = await api('/activity-feedback?' + params.toString());
        feedbackLikesEnabled = !!result.likes_enabled;
        if (activeFeedbackSort === 'hot' && !feedbackLikesEnabled) {
          activeFeedbackSort = 'latest';
        }
        updateFeedbackSortUi();
        renderDisplayFeedbackList(Array.isArray(result.items) ? result.items : []);
      } catch (e) {
        document.getElementById('feedbackList').innerHTML = '<div class="spotlight-empty">信息反馈区加载失败</div>';
      }
    }

    async function toggleDisplayFeedbackLike(feedbackId) {
      if (!viewerUser?.id || viewerIsGuest || teacherMode) {
        toast('请先登录学生账号后再点赞', 'error');
        return;
      }
      try {
        await api('/activity-feedback/' + encodeURIComponent(feedbackId) + '/like', {
          method: 'POST',
          body: JSON.stringify({
            activity_id: actId,
            user_id: viewerUser.id
          })
        });
        await loadDisplayFeedback();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function postDisplayFeedback() {
      if (!viewerUser?.id || viewerIsGuest || teacherMode) return;
      const input = document.getElementById('displayFeedbackInput');
      if (!input) return;
      const content = input.value.trim();
      if (!content) return toast('请输入信息反馈内容', 'error');
      try {
        await api('/activity-feedback', {
          method: 'POST',
          body: JSON.stringify({
            activity_id: actId,
            user_id: viewerUser.id,
            content
          })
        });
        input.value = '';
        toast('信息反馈已提交', 'success');
        await loadDisplayFeedback();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function loadSpotlightComments(submissionId) {
      try {
        const comments = await api('/comments?submission_id=' + submissionId);
        if (comments.length > 0) {
          document.getElementById('spotComments').innerHTML = comments.map(c => `
            <div class="spotlight-comment">
              <div class="spotlight-comment-text">${c.content}</div>
              <div class="spotlight-comment-time">${timeAgo(c.created_at)}</div>
            </div>
          `).join('');
        } else {
          document.getElementById('spotComments').innerHTML = '<div class="spotlight-empty">暂无评价</div>';
        }
      } catch (e) {
        document.getElementById('spotComments').innerHTML = '<div class="spotlight-empty">评论加载失败</div>';
      }
    }

    function renderSpotlightRatingStars() {
      const box = document.getElementById('spotActionBox');
      box.querySelectorAll('.spotlight-rate-star-btn').forEach(el => {
        const val = Number(el.dataset.value || 0);
        el.classList.toggle('active', val <= activeSpotlightMyRating);
      });
      const hint = document.getElementById('spotRateHint');
      if (hint) {
        hint.textContent = activeSpotlightMyRating
          ? `你已评 ${activeSpotlightMyRating} 分，点击星星可修改`
          : '点击星星即可匿名评分';
      }
    }

    async function renderSpotlightActions(work) {
      const box = document.getElementById('spotActionBox');
      const loginUrl = 'index.html' + ((act && act.invite_code) ? ('?code=' + encodeURIComponent(act.invite_code)) : '');

      if (teacherMode) {
        box.innerHTML = '<div class="spotlight-action-title">教师展示模式</div><div class="spotlight-action-hint">当前大屏用于展示，教师端不参与评分或评论。</div>';
        return;
      }
      if (!viewerUser || viewerIsGuest) {
        box.innerHTML = `
          <div class="spotlight-action-title">登录后可互动</div>
          <div class="spotlight-action-hint">学生登录后，可在大屏中直接为其他同学的作品评分和评论。</div>
          <a class="spotlight-link-btn" href="${loginUrl}">去登录学生账号</a>
        `;
        return;
      }
      if (work.is_owner) {
        box.innerHTML = `
          <div class="spotlight-action-title">这是你的作品</div>
          <div class="spotlight-action-hint">为保证公平，你不能给自己的作品评分或评论，但仍可在这里放大查看。</div>
          <button class="btn btn-secondary spotlight-open-detail" onclick="location.href='student-detail.html?id=${encodeURIComponent(work.id)}'">打开作品详情页</button>
        `;
        return;
      }

      try {
        const myRatings = await api('/ratings/my?activity_id=' + actId + '&user_id=' + viewerUser.id);
        const existing = (myRatings || []).find(r => String(r.submission_id) === String(work.id));
        activeSpotlightMyRating = existing ? Number(existing.score) : 0;
      } catch (e) {
        box.innerHTML = `
          <div class="spotlight-action-title">学生会话已失效</div>
          <div class="spotlight-action-hint">请重新登录后，再在大屏中进行评分和评论。</div>
          <a class="spotlight-link-btn" href="${loginUrl}">重新登录</a>
        `;
        return;
      }

      box.innerHTML = `
        <div class="spotlight-action-title">直接互动</div>
        ${act.voting_open
          ? `
            <div class="spotlight-rate-row">
              ${[1,2,3,4,5].map(i => `<button type="button" class="spotlight-rate-star-btn" data-value="${i}" onclick="rateFromSpotlight(${i})">★</button>`).join('')}
            </div>
            <div id="spotRateHint" class="spotlight-rate-hint"></div>
          `
          : '<div class="spotlight-action-hint" style="margin-bottom:10px;">教师暂未开放评分。</div>'}
        ${act.comments_open
          ? `
            <div class="spotlight-action-hint">你可以直接在这里匿名评论这份作品。</div>
            <div class="spotlight-comment-compose">
              <input type="text" id="spotCommentInput" maxlength="100" placeholder="写下你的评价或建议...">
              <button class="btn btn-primary" type="button" onclick="postSpotlightComment()">发送</button>
            </div>
          `
          : '<div class="spotlight-action-hint">教师暂未开放评论。</div>'}
        <button class="btn btn-secondary spotlight-open-detail" onclick="location.href='student-detail.html?id=${encodeURIComponent(work.id)}'">打开完整详情页</button>
      `;

      if (act.voting_open) renderSpotlightRatingStars();
    }

    async function rateFromSpotlight(score) {
      if (!activeSpotlightWork || !viewerUser?.id || activeSpotlightWork.is_owner) return;
      try {
        const res = await api('/ratings', {
          method: 'POST',
          body: JSON.stringify({
            activity_id: actId,
            submission_id: activeSpotlightWork.id,
            rater_user_id: viewerUser.id,
            score
          })
        });
        activeSpotlightMyRating = score;
        renderSpotlightRatingStars();
        document.getElementById('spotAvg').textContent = Number(res.average).toFixed(1);
        document.getElementById('spotRaters').textContent = res.count;
        if (activeSpotlightWork) {
          activeSpotlightWork.average_rating = res.average;
          activeSpotlightWork.rating_count = res.count;
        }
        toast('评分成功', 'success');
        refresh();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function postSpotlightComment() {
      if (!activeSpotlightWork || !viewerUser?.id || activeSpotlightWork.is_owner) return;
      const input = document.getElementById('spotCommentInput');
      if (!input) return;
      const content = input.value.trim();
      if (!content) return;
      try {
        await api('/comments', {
          method: 'POST',
          body: JSON.stringify({
            activity_id: actId,
            submission_id: activeSpotlightWork.id,
            user_id: viewerUser.id,
            content
          })
        });
        input.value = '';
        const countEl = document.getElementById('spotCommentsCount');
        countEl.textContent = Number(countEl.textContent || 0) + 1;
        toast('评论已发送', 'success');
        await loadSpotlightComments(activeSpotlightWork.id);
        refresh();
      } catch (e) {
        toast(e.message, 'error');
      }
    }
  </script>
</body>
</html>
