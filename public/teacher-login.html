<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教师登录 - ClassShow</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="page-center">
    <div class="auth-box">
      <a href="index.html" class="back-link">返回首页</a>
      <h1>教师<span>后台</span></h1>

      <div id="loginForm">
        <p class="subtitle">输入邀请码和教师密码，进入当前活动后台。</p>
        <div class="form-group">
          <label>课堂邀请码</label>
          <input type="text" id="loginCode" placeholder="输入邀请码" style="text-transform:uppercase;">
        </div>
        <div class="form-group">
          <label>教师密码</label>
          <input type="password" id="loginPwd" placeholder="输入教师密码">
        </div>
        <button class="btn btn-primary btn-block btn-lg" onclick="doLogin()">登录后台</button>
        <div class="auth-divider">或</div>
        <button class="btn btn-secondary btn-block" onclick="showCreate()">+ 创建新活动</button>
        <button class="btn btn-secondary btn-block" style="margin-top:8px;" onclick="location.href='help'">帮助中心</button>
        <button class="btn btn-secondary btn-block" style="margin-top:8px;" onclick="location.href='teacher-quick-manual.html'">教师使用手册</button>
        <button class="btn btn-secondary btn-block" style="margin-top:8px;" onclick="location.href='super-admin.html'">超级管理员统一课程管理</button>
      </div>

      <div id="createForm" style="display:none;">
        <p class="subtitle">创建一个新的课程活动。经济学活动创建后，会先锁定学生入口，必须先导入 Excel 名单再开放邀请码。</p>
        <div class="form-group">
          <label>课程名称 *</label>
          <input type="text" id="courseName" placeholder="例如：经济学基础">
        </div>
        <div class="form-group">
          <label>班级名称 *</label>
          <input type="text" id="clsName" placeholder="例如：2026级新生1班">
        </div>
        <div class="form-group">
          <label>活动名称 *</label>
          <input type="text" id="actName" placeholder="例如：供需图解读挑战">
        </div>
        <div class="form-group">
          <label>活动说明</label>
          <textarea id="actDesc" placeholder="简要说明本次活动要求"></textarea>
        </div>
        <div class="form-group">
          <label>邀请码 *</label>
          <input type="text" id="invCode" placeholder="例如：ECON101" style="text-transform:uppercase;">
        </div>
        <p class="form-hint" style="margin-top:-6px;margin-bottom:14px;">
          这个邀请码会先由老师保留。只有名单导入成功后，教师后台才会显示为“可发给学生”。
        </p>
        <div class="form-group">
          <label>教师密码 *</label>
          <input type="password" id="teacherPwd" placeholder="设置后台管理密码">
        </div>
        <button class="btn btn-primary btn-block btn-lg" onclick="createActivity()">创建活动并进入名单设置</button>
        <button class="btn btn-secondary btn-block" style="margin-top:8px;" onclick="showLogin()">返回登录</button>
      </div>
    </div>
  </div>

  <script>window.CLASSSHOW_SURFACE = 'backend';</script>
  <script src="js/deployment-config.js"></script>
  <script src="js/app-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    const teacherBackLink = document.querySelector('.back-link');
    if (teacherBackLink) {
      teacherBackLink.onclick = () => {
        navigateToStudent('/student-entry.html');
        return false;
      };
    }

    if (new URLSearchParams(location.search).get('create') === '1') showCreate();

    function showCreate() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('createForm').style.display = 'block';
    }

    function showLogin() {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('createForm').style.display = 'none';
    }

    async function doLogin() {
      const code = document.getElementById('loginCode').value.trim().toUpperCase();
      const pwd = document.getElementById('loginPwd').value;
      if (!code || !pwd) return toast('请填写完整', 'error');
      try {
        const res = await api('/teacher/login', {
          method: 'POST',
          body: JSON.stringify({ invite_code: code, password: pwd })
        });
        sessionStorage.setItem('teacherToken', res.token);
        sessionStorage.setItem('classshow_activity', JSON.stringify(res.activity));
        sessionStorage.setItem('classshow_activity_id', res.activity.id);
        location.href = 'teacher-dashboard.html';
      } catch (e) {
        toast('登录失败: ' + e.message, 'error');
      }
    }

    async function createActivity() {
      const data = {
        course_name: document.getElementById('courseName').value.trim(),
        class_name: document.getElementById('clsName').value.trim(),
        activity_name: document.getElementById('actName').value.trim(),
        description: document.getElementById('actDesc').value.trim(),
        invite_code: document.getElementById('invCode').value.trim().toUpperCase(),
        teacher_password: document.getElementById('teacherPwd').value
      };
      if (!data.course_name || !data.class_name || !data.activity_name || !data.invite_code || !data.teacher_password) {
        return toast('请填写所有必填项', 'error');
      }
      try {
        const act = await api('/activities', { method: 'POST', body: JSON.stringify(data) });
        toast(
          act?.roster_auto_reused
            ? `活动已创建，并已自动继承上一份实名名单（${act.roster_auto_reused_count || 0} 人）。`
            : '活动已创建。请先上传 Excel 名单，名单导入后系统才会解锁邀请码。',
          'success'
        );
        const loginRes = await api('/teacher/login', {
          method: 'POST',
          body: JSON.stringify({ invite_code: data.invite_code, password: data.teacher_password })
        });
        sessionStorage.setItem('teacherToken', loginRes.token);
        sessionStorage.setItem('classshow_activity', JSON.stringify(loginRes.activity));
        sessionStorage.setItem('classshow_activity_id', loginRes.activity.id);
        setTimeout(() => { location.href = 'teacher-dashboard.html?setup=roster'; }, 800);
      } catch (e) {
        toast('创建失败: ' + e.message, 'error');
      }
    }
  </script>
</body>
</html>
