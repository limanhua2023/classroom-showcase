<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教师后台 - ClassShow</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">Class<span>Show</span> · 教师后台</div>
    <div class="topbar-right">
      <button class="btn btn-sm btn-secondary" onclick="location.href='teacher-works.html'">📋 作品管理</button>
      <button class="btn btn-sm btn-secondary" onclick="location.href='teacher-scores.html'">📊 评分成绩</button>
      <button class="btn btn-sm btn-secondary" onclick="openDisplay()">🖥️ 大屏展示</button>
      <button class="btn btn-sm btn-danger" onclick="sessionStorage.clear();location.href='index.html'">退出</button>
    </div>
  </div>
  <div class="container" style="padding-top:24px;">
    <h2 id="actTitle" style="margin-bottom:4px;"></h2>
    <p id="actSubtitle" style="color:var(--text-muted);margin-bottom:20px;"></p>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card"><div class="stat-value" id="sUsers">0</div><div class="stat-label">参与学生</div></div>
      <div class="stat-card"><div class="stat-value" id="sSubs">0</div><div class="stat-label">作品数量</div></div>
      <div class="stat-card"><div class="stat-value" id="sRatings">0</div><div class="stat-label">评分次数</div></div>
    </div>

    <!-- Controls -->
    <div class="card" style="margin:20px 0;">
      <div class="card-body" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
        <h3 style="margin-right:auto;">活动控制</h3>
        <div>
          上传：<button class="btn btn-sm" id="toggleUpload" onclick="toggleSetting('upload_open')"></button>
        </div>
        <div>
          评分：<button class="btn btn-sm" id="toggleVoting" onclick="toggleSetting('voting_open')"></button>
        </div>
        <div>
          实时排行：<button class="btn btn-sm" id="toggleRanking" onclick="toggleSetting('show_live_ranking')"></button>
        </div>
        <div>
          匿名评论：<button class="btn btn-sm" id="toggleComments" onclick="toggleSetting('comments_open')"></button>
        </div>
        <div>
          名单限制：<button class="btn btn-sm" id="toggleRoster" onclick="toggleSetting('roster_enabled')"></button>
        </div>
        <div>
          PIN登录：<button class="btn btn-sm" id="togglePin" onclick="toggleSetting('pin_required')"></button>
        </div>
      </div>
    </div>

    <!-- Student roster -->
    <div class="card" style="margin:20px 0;">
      <div class="card-body">
        <h3 style="margin-bottom:12px;">🔐 学生名单 / PIN</h3>
        <p class="form-hint" style="margin-bottom:10px;">每行一名学生：学号,姓名,班级,小组,PIN。小组和 PIN 可留空；开启 PIN 登录前建议全部填写 PIN。</p>
        <textarea id="rosterText" rows="6" style="width:100%;font-family:monospace;" placeholder="2026001,张三,AIOT 59-1,A组,1234&#10;2026002,李四,AIOT 59-1,A组,5678"></textarea>
        <div style="display:flex;gap:10px;align-items:center;margin-top:10px;">
          <button class="btn btn-primary" onclick="importRoster()">导入/更新名单</button>
          <button class="btn btn-secondary" onclick="loadRoster()">刷新名单</button>
          <span id="rosterStatus" style="color:var(--text-muted);font-size:0.9rem;"></span>
        </div>
        <div class="table-wrap" style="margin-top:12px;max-height:260px;overflow:auto;">
          <table>
            <thead><tr><th>学号</th><th>姓名</th><th>班级</th><th>小组</th><th>状态</th></tr></thead>
            <tbody id="rosterBody"><tr><td colspan="5" style="color:var(--text-muted);">尚未加载</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Activity Info -->
    <div class="card">
      <div class="card-body">
        <h3 style="margin-bottom:12px;">📌 活动信息</h3>
        <table style="width:100%;">
          <tr><td style="font-weight:600;width:100px;">邀请码</td><td><span id="invCode" style="font-size:1.3rem;font-weight:800;color:var(--primary);letter-spacing:2px;"></span></td></tr>
          <tr><td style="font-weight:600;">课程</td><td id="infoCourse"></td></tr>
          <tr><td style="font-weight:600;">班级</td><td id="infoClass"></td></tr>
          <tr><td style="font-weight:600;">活动</td><td id="infoActivity"></td></tr>
          <tr><td style="font-weight:600;">说明</td><td id="infoDesc"></td></tr>
        </table>
        <div style="margin-top:20px;text-align:center;">
          <img id="qrCode" style="width:150px;height:150px;border-radius:8px;border:1px solid var(--border);display:none;margin:0 auto 8px auto;">
          <p style="font-size:0.85rem;color:var(--text-muted);"><a href="#" id="downloadQr" style="display:none;" download="课堂二维码.png">下载二维码图片</a></p>
        </div>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    const act = JSON.parse(sessionStorage.getItem('classshow_activity') || '{}');
    const token = sessionStorage.getItem('teacherToken');
    if (!token) location.href = 'teacher-login.html';
    const actId = act.id;

    document.getElementById('actTitle').textContent = act.activity_name || '';
    document.getElementById('actSubtitle').textContent = (act.course_name || '') + ' · ' + (act.class_name || '');
    document.getElementById('invCode').textContent = act.invite_code || '';
    document.getElementById('infoCourse').textContent = act.course_name || '';
    document.getElementById('infoClass').textContent = act.class_name || '';
    document.getElementById('infoActivity').textContent = act.activity_name || '';
    document.getElementById('infoDesc').textContent = act.description || '无';

    function updateToggleBtn(id, val) {
      const btn = document.getElementById(id);
      btn.textContent = val ? '已开启 ✓' : '已关闭 ✕';
      btn.className = 'btn btn-sm ' + (val ? 'btn-success' : 'btn-danger');
    }
    updateToggleBtn('toggleUpload', act.upload_open);
    updateToggleBtn('toggleVoting', act.voting_open);
    updateToggleBtn('toggleRanking', act.show_live_ranking);
    updateToggleBtn('toggleComments', act.comments_open);
    updateToggleBtn('toggleRoster', act.roster_enabled);
    updateToggleBtn('togglePin', act.pin_required);

    // Generate QR Code
    async function loadQrCode() {
      try {
        const url = location.origin + '/index.html?code=' + act.invite_code;
        const res = await api('/qrcode?text=' + encodeURIComponent(url));
        if (res.url) {
          const img = document.getElementById('qrCode');
          img.src = res.url;
          img.style.display = 'block';
          const a = document.getElementById('downloadQr');
          a.href = res.url;
          a.style.display = 'inline-block';
        }
      } catch (e) {}
    }
    loadQrCode();

    function openDisplay() {
      const code = (act.invite_code || '').trim();
      const url = code ? ('display.html?code=' + encodeURIComponent(code)) : 'display.html';
      window.open(url, '_blank');
    }

    async function toggleSetting(key) {
      const newVal = !act[key];
      try {
        const updated = await api('/activities/' + actId, { method: 'PUT', body: JSON.stringify({ [key]: newVal }) });
        act[key] = newVal;
        sessionStorage.setItem('classshow_activity', JSON.stringify({ ...act, [key]: newVal }));
        toast(key + ' → ' + (newVal ? '开启' : '关闭'), 'success');
        updateToggleBtn('toggleUpload', act.upload_open);
        updateToggleBtn('toggleVoting', act.voting_open);
        updateToggleBtn('toggleRanking', act.show_live_ranking);
        updateToggleBtn('toggleComments', act.comments_open);
        updateToggleBtn('toggleRoster', act.roster_enabled);
        updateToggleBtn('togglePin', act.pin_required);
      } catch (e) { toast('操作失败', 'error'); }
    }

    function parseRosterRows(text) {
      return text.split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line && !line.startsWith('#'))
        .map(line => {
          const [student_id, name, class_name, group_name, pin] = line.split(',').map(v => (v || '').trim());
          return { student_id, name, class_name, group_name, pin };
        })
        .filter(row => row.student_id && row.name && row.class_name);
    }

    async function importRoster() {
      const students = parseRosterRows(document.getElementById('rosterText').value);
      if (students.length === 0) return toast('没有有效名单行', 'error');
      try {
        const res = await api('/teacher/roster/import', {
          method: 'POST',
          body: JSON.stringify({ activity_id: actId, students })
        });
        toast('名单导入成功：' + res.imported + ' 人', 'success');
        document.getElementById('rosterText').value = '';
        loadRoster();
      } catch (e) { toast('名单导入失败: ' + e.message, 'error'); }
    }

    async function loadRoster() {
      try {
        const rows = await api('/teacher/roster?activity_id=' + actId);
        document.getElementById('rosterStatus').textContent = '已导入 ' + rows.length + ' 人';
        document.getElementById('rosterBody').innerHTML = rows.length ? rows.map(r => `
          <tr>
            <td>${escapeHtml(r.student_id)}</td>
            <td>${escapeHtml(r.name)}</td>
            <td>${escapeHtml(r.class_name)}</td>
            <td>${escapeHtml(r.group_name || '-')}</td>
            <td>${r.active === false ? '停用' : '启用'}</td>
          </tr>
        `).join('') : '<tr><td colspan="5" style="color:var(--text-muted);">暂无名单</td></tr>';
      } catch (e) {
        document.getElementById('rosterStatus').textContent = '名单功能未初始化';
      }
    }

    async function loadStats() {
      try {
        const stats = await api('/activities/' + actId + '/stats');
        document.getElementById('sUsers').textContent = stats.users;
        document.getElementById('sSubs').textContent = stats.submissions;
        document.getElementById('sRatings').textContent = stats.ratings;
      } catch (e) {}
    }
    loadStats();
    loadRoster();
    setInterval(loadStats, 10000);
  </script>
</body>
</html>
