<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教师后台 - ClassShow</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">Class<span>Show</span> · 教师后台</div>
    <div class="topbar-right">
      <button class="btn btn-sm btn-secondary" onclick="location.href='teacher-works.html'">作品管理</button>
      <button class="btn btn-sm btn-secondary" onclick="location.href='teacher-scores.html'">评分成绩</button>
      <button class="btn btn-sm btn-secondary" onclick="openDisplay()">大屏展示</button>
      <button class="btn btn-sm btn-danger" onclick="sessionStorage.clear();location.href='index.html'">退出</button>
    </div>
  </div>

  <div class="container" style="padding-top:24px;">
    <h2 id="actTitle" style="margin-bottom:4px;"></h2>
    <p id="actSubtitle" style="color:var(--text-muted);margin-bottom:20px;"></p>

    <div class="stats-row">
      <div class="stat-card"><div class="stat-value" id="sUsers">0</div><div class="stat-label">参与学生</div></div>
      <div class="stat-card"><div class="stat-value" id="sSubs">0</div><div class="stat-label">作品数量</div></div>
      <div class="stat-card"><div class="stat-value" id="sRatings">0</div><div class="stat-label">评分次数</div></div>
    </div>

    <div class="card" style="margin:20px 0;">
      <div class="card-body" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
        <h3 style="margin-right:auto;">活动控制</h3>
        <div>上传：<button class="btn btn-sm" id="toggleUpload" onclick="toggleSetting('upload_open')"></button></div>
        <div>评分：<button class="btn btn-sm" id="toggleVoting" onclick="toggleSetting('voting_open')"></button></div>
        <div>实时排名：<button class="btn btn-sm" id="toggleRanking" onclick="toggleSetting('show_live_ranking')"></button></div>
        <div>匿名评论：<button class="btn btn-sm" id="toggleComments" onclick="toggleSetting('comments_open')"></button></div>
        <div>名单限制：<button class="btn btn-sm" id="toggleRoster" onclick="toggleSetting('roster_enabled')"></button></div>
        <div>PIN登录：<button class="btn btn-sm" id="togglePin" onclick="toggleSetting('pin_required')"></button></div>
      </div>
    </div>

    <div class="card" style="margin:20px 0;">
      <div class="card-body">
        <h3 style="margin-bottom:12px;">学生名单</h3>
        <p class="form-hint" style="margin-bottom:10px;">
          Excel 只需要两列：姓名、学号。上传后系统会自动开启名单限制，并关闭 PIN 登录。
        </p>

        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
          <input id="rosterFile" type="file" accept=".xlsx,.csv" />
          <button class="btn btn-primary" type="button" onclick="importRosterFile()">上传名单</button>
          <button class="btn btn-secondary" type="button" onclick="loadRoster()">刷新名单</button>
          <span id="rosterStatus" style="color:var(--text-muted);font-size:0.9rem;"></span>
        </div>

        <details style="margin-bottom:12px;">
          <summary style="cursor:pointer;font-weight:600;">手工粘贴导入</summary>
          <p class="form-hint" style="margin:8px 0;">每行一名学生，格式：姓名,学号</p>
          <textarea id="rosterText" rows="4" style="width:100%;font-family:monospace;" placeholder="张三,2026001&#10;李四,2026002"></textarea>
          <button class="btn btn-secondary" type="button" style="margin-top:8px;" onclick="importRosterText()">导入粘贴名单</button>
        </details>

        <div class="table-wrap" style="margin-top:12px;max-height:300px;overflow:auto;">
          <table>
            <thead><tr><th>姓名</th><th>学号</th><th>状态</th></tr></thead>
            <tbody id="rosterBody"><tr><td colspan="3" style="color:var(--text-muted);">尚未加载</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h3 style="margin-bottom:12px;">活动信息</h3>
        <table style="width:100%;">
          <tr><td style="font-weight:600;width:100px;">邀请码</td><td><span id="invCode" style="font-size:1.3rem;font-weight:800;color:var(--primary);letter-spacing:2px;"></span></td></tr>
          <tr><td style="font-weight:600;">课程</td><td id="infoCourse"></td></tr>
          <tr><td style="font-weight:600;">班级</td><td id="infoClass"></td></tr>
          <tr><td style="font-weight:600;">活动</td><td id="infoActivity"></td></tr>
          <tr><td style="font-weight:600;">说明</td><td id="infoDesc"></td></tr>
        </table>
        <div style="margin-top:20px;text-align:center;">
          <img id="qrCode" style="width:150px;height:150px;border-radius:8px;border:1px solid var(--border);display:none;margin:0 auto 8px auto;">
          <p style="font-size:0.85rem;color:var(--text-muted);">
            <a href="#" id="downloadQr" style="display:none;" download="课堂二维码.png">下载二维码图片</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const act = JSON.parse(sessionStorage.getItem('classshow_activity') || '{}');
    const token = sessionStorage.getItem('teacherToken');
    if (!token) location.href = 'teacher-login.html';
    const actId = act.id;
    if (!actId) location.href = 'index.html';

    document.getElementById('actTitle').textContent = act.activity_name || '';
    document.getElementById('actSubtitle').textContent = (act.course_name || '') + ' · ' + (act.class_name || '');
    document.getElementById('invCode').textContent = act.invite_code || '';
    document.getElementById('infoCourse').textContent = act.course_name || '';
    document.getElementById('infoClass').textContent = act.class_name || '';
    document.getElementById('infoActivity').textContent = act.activity_name || '';
    document.getElementById('infoDesc').textContent = act.description || '无';

    const settingLabels = {
      upload_open: '上传',
      voting_open: '评分',
      show_live_ranking: '实时排名',
      comments_open: '匿名评论',
      roster_enabled: '名单限制',
      pin_required: 'PIN登录'
    };

    function updateToggleBtn(id, val) {
      const btn = document.getElementById(id);
      btn.textContent = val ? '已开启 ✓' : '已关闭 ✕';
      btn.className = 'btn btn-sm ' + (val ? 'btn-success' : 'btn-danger');
    }

    function updateAllToggleBtns() {
      updateToggleBtn('toggleUpload', act.upload_open);
      updateToggleBtn('toggleVoting', act.voting_open);
      updateToggleBtn('toggleRanking', act.show_live_ranking);
      updateToggleBtn('toggleComments', act.comments_open);
      updateToggleBtn('toggleRoster', act.roster_enabled);
      updateToggleBtn('togglePin', act.pin_required);
    }

    function applyActivityPatch(activityPatch) {
      if (!activityPatch) return;
      Object.assign(act, activityPatch);
      sessionStorage.setItem('classshow_activity', JSON.stringify(act));
      updateAllToggleBtns();
    }

    updateAllToggleBtns();

    async function loadQrCode() {
      try {
        const url = location.origin + '/index.html?code=' + act.invite_code;
        const res = await api('/qrcode?text=' + encodeURIComponent(url));
        if (res.url) {
          const img = document.getElementById('qrCode');
          img.src = res.url;
          img.style.display = 'block';
          const anchor = document.getElementById('downloadQr');
          anchor.href = res.url;
          anchor.style.display = 'inline-block';
        }
      } catch (e) {}
    }

    function openDisplay() {
      const code = (act.invite_code || '').trim();
      const url = code ? ('display.html?code=' + encodeURIComponent(code)) : 'display.html';
      window.open(url, '_blank');
    }

    async function toggleSetting(key) {
      const newVal = !act[key];
      try {
        await api('/activities/' + actId, { method: 'PUT', body: JSON.stringify({ [key]: newVal }) });
        applyActivityPatch({ [key]: newVal });
        toast((settingLabels[key] || key) + (newVal ? ' 已开启' : ' 已关闭'), 'success');
      } catch (e) {
        toast('操作失败: ' + e.message, 'error');
      }
    }

    function parseRosterText(text) {
      return text.split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => line.split(',').map(v => (v || '').trim()))
        .map(parts => {
          let name = parts[0] || '';
          let student_id = parts[1] || '';
          if (/[0-9]/.test(parts[0] || '') && !/[0-9]/.test(parts[1] || '')) {
            student_id = parts[0] || '';
            name = parts[1] || '';
          }
          return { name, student_id };
        })
        .filter(row => row.name && row.student_id && row.name !== '姓名' && row.student_id !== '学号');
    }

    async function handleImportResult(res) {
      applyActivityPatch(res.activity);
      toast('名单导入成功：' + res.imported + ' 人', 'success');
      await loadRoster();
    }

    async function importRosterText() {
      try {
        const students = parseRosterText(document.getElementById('rosterText').value);
        if (students.length === 0) return toast('没有有效名单行', 'error');
        const res = await api('/teacher/roster/import', {
          method: 'POST',
          body: JSON.stringify({
            activity_id: actId,
            default_class_name: act.class_name || '',
            students
          })
        });
        document.getElementById('rosterText').value = '';
        await handleImportResult(res);
      } catch (e) {
        toast('名单导入失败: ' + e.message, 'error');
      }
    }

    async function importRosterFile() {
      const input = document.getElementById('rosterFile');
      const file = input.files && input.files[0];
      if (!file) return toast('请先选择 .xlsx 或 .csv 名单文件', 'error');

      const fd = new FormData();
      fd.append('activity_id', actId);
      fd.append('default_class_name', act.class_name || '');
      fd.append('roster', file);

      try {
        const res = await fetch('/api/teacher/roster/import-file', {
          method: 'POST',
          headers: { 'x-teacher-auth': token },
          body: fd
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || res.statusText);
        input.value = '';
        await handleImportResult(data);
      } catch (e) {
        toast('文件导入失败: ' + e.message, 'error');
      }
    }

    async function loadRoster() {
      try {
        const rows = await api('/teacher/roster?activity_id=' + actId);
        document.getElementById('rosterStatus').textContent = '已导入 ' + rows.length + ' 人';
        document.getElementById('rosterBody').innerHTML = rows.length ? rows.map(r => `
          <tr>
            <td>${escapeHtml(r.name)}</td>
            <td>${escapeHtml(r.student_id)}</td>
            <td>${r.active === false ? '停用' : '启用'}</td>
          </tr>
        `).join('') : '<tr><td colspan="3" style="color:var(--text-muted);">暂无名单</td></tr>';
      } catch (e) {
        document.getElementById('rosterStatus').textContent = '名单功能未初始化';
      }
    }

    async function loadStats() {
      try {
        const stats = await api('/activities/' + actId + '/stats');
        document.getElementById('sUsers').textContent = stats.users;
        document.getElementById('sSubs').textContent = stats.submissions;
        document.getElementById('sRatings').textContent = stats.ratings;
      } catch (e) {}
    }

    loadQrCode();
    loadStats();
    loadRoster();
    setInterval(loadStats, 10000);
  </script>
</body>
</html>
