<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品画廊 - ClassShow</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">Class<span>Show</span></div>
    <div class="topbar-right">
      <button class="btn btn-sm btn-secondary" onclick="openDisplay()">大屏</button>
      <button class="btn btn-sm btn-secondary" onclick="loadWorks()">刷新</button>
      <button class="btn btn-sm btn-primary" id="uploadBtn" onclick="location.href='student-upload.html?new=1'">上传作品</button>
    </div>
  </div>

  <div class="container">
    <section class="gallery-hero">
      <div class="gallery-kicker">LIVE WORK GALLERY</div>
      <h1 id="galleryTitle">作品画廊</h1>
      <p id="gallerySubtitle">上传作品、浏览同学创作，并为非本人作品进行评分和评论。</p>
      <div class="gallery-actions">
        <button class="btn btn-primary" id="heroUploadBtn" onclick="location.href='student-upload.html?new=1'">上传新作品</button>
        <button class="btn btn-secondary" onclick="openDisplay()">打开大屏展示</button>
      </div>
    </section>

    <div class="stats-row" id="statsRow">
      <div class="stat-card"><div class="stat-value" id="totalWorks">0</div><div class="stat-label">作品总数</div></div>
      <div class="stat-card"><div class="stat-value" id="myRated">0</div><div class="stat-label">已评分数</div></div>
    </div>

    <div id="newSection" style="display:none;">
      <div class="section-header">
        <h3 class="section-title">新作品展示区</h3>
        <span class="card-badge new">10分钟内</span>
      </div>
      <div class="exhibit-grid" id="newGrid"></div>
    </div>

    <div class="rubric" id="rubricBox" style="display:none;">
      <h3>评分标准（1-5分）</h3>
      <ol>
        <li><strong>内容完整性：</strong>作品是否完整、清楚、有主题</li>
        <li><strong>视觉表达：</strong>图片、海报、图表是否清晰美观</li>
        <li><strong>数据使用：</strong>是否使用了真实或合理的数据</li>
        <li><strong>AI辅助质量：</strong>AI使用是否有效</li>
        <li><strong>创意与实用性：</strong>作品是否有新意</li>
      </ol>
    </div>

    <div class="section-header" style="margin-top:16px;">
      <h3 class="section-title">全部作品</h3>
    </div>
    <div class="exhibit-grid" id="allGrid">
      <div class="empty">还没有作品，快来上传第一个吧！</div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const user = getSessionOrGuest();
    const actId = getActivityId();
    if (!user || !actId) location.href = 'index.html';

    const act = JSON.parse(sessionStorage.getItem('classshow_activity') || '{}');
    const guest = isGuest();
    let myRatings = {};

    document.getElementById('galleryTitle').textContent = act.activity_name || '作品画廊';
    document.getElementById('gallerySubtitle').textContent =
      [act.course_name, act.class_name].filter(Boolean).join(' · ') || '上传作品、浏览同学创作，并为非本人作品进行评分和评论。';

    if (guest) {
      document.getElementById('uploadBtn').style.display = 'none';
      document.getElementById('heroUploadBtn').style.display = 'none';
      const banner = document.createElement('div');
      banner.style.cssText = 'background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.22);color:#0369a1;padding:11px 16px;border-radius:10px;font-size:0.9rem;margin:16px 0;text-align:center;font-weight:700;';
      banner.innerHTML = '访客模式：可以浏览作品，不能评分或评论。<a href="index.html" style="color:#0369a1;font-weight:900;">登录后参与互动</a>';
      document.querySelector('.container').insertBefore(banner, document.getElementById('statsRow'));
    }

    function openDisplay() {
      const code = (act.invite_code || '').trim();
      const url = code ? ('display.html?code=' + encodeURIComponent(code)) : 'display.html';
      window.open(url, '_blank');
    }

    async function loadWorks() {
      try {
        let works, ratings = [];
        if (guest) {
          works = await api('/submissions?activity_id=' + actId);
        } else {
          [works, ratings] = await Promise.all([
            api('/submissions?activity_id=' + actId + '&viewer_user_id=' + user.id),
            api('/ratings/my?activity_id=' + actId + '&user_id=' + user.id)
          ]);
        }

        myRatings = {};
        ratings.forEach(r => myRatings[r.submission_id] = r.score);
        document.getElementById('totalWorks').textContent = works.length;
        document.getElementById('myRated').textContent = guest ? '-' : ratings.length;
        if (act.voting_open && !guest) document.getElementById('rubricBox').style.display = 'block';

        const newWorks = works.filter(w => isNewWork(w.upload_time));
        const allWorks = works.filter(w => !isNewWork(w.upload_time));
        for (let i = allWorks.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [allWorks[i], allWorks[j]] = [allWorks[j], allWorks[i]];
        }
        allWorks.sort((a, b) => (b.is_pinned ? 1 : 0) - (a.is_pinned ? 1 : 0));

        if (newWorks.length > 0) {
          document.getElementById('newSection').style.display = 'block';
          document.getElementById('newGrid').innerHTML = newWorks.map(w => workCard(w)).join('');
        } else {
          document.getElementById('newSection').style.display = 'none';
        }
        document.getElementById('allGrid').innerHTML = allWorks.length
          ? allWorks.map(w => workCard(w)).join('')
          : '<div class="empty">等待更多作品加入展示墙</div>';

        if (!act.upload_open) {
          document.getElementById('uploadBtn').style.display = 'none';
          document.getElementById('heroUploadBtn').style.display = 'none';
        }
      } catch (e) {
        toast('加载失败: ' + e.message, 'error');
      }
    }

    function workCard(w) {
      const isOwn = !!w.is_owner;
      const rated = myRatings[w.id];
      const isNew = isNewWork(w.upload_time);
      const vid = isVideo(w.image_url);
      const template = pickWorkTemplate(`${w.id || w.anonymous_code}-${w.media_type || ''}`);
      const templateLabelMap = {
        aurora: 'Aurora',
        gallery: 'Gallery',
        signal: 'Signal',
        studio: 'Studio'
      };
      const mediaEl = vid
        ? `<div class="exhibit-media" style="background:#0f172a;">
             <video src="${w.image_url}" muted playsinline loop preload="metadata"
               style="width:100%;height:100%;object-fit:cover;display:block;"
               oncanplay="startFiveSecPreview(this)"></video>
             <div class="exhibit-overlay">
               <span class="exhibit-template-label">MP4 Showcase</span>
             </div>
           </div>`
        : `<div class="exhibit-media skeleton" style="display:flex;align-items:center;justify-content:center;">
             <img class="card-img" style="width:100%;height:100%;opacity:0;transition:opacity 0.5s;" onload="this.style.opacity=1;this.parentElement.classList.remove('skeleton')" src="${w.image_url}" alt="${escapeHtml(w.title)}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22><rect fill=%22%23e2e8f0%22 width=%221%22 height=%221%22/></svg>'">
             <div class="exhibit-overlay">
               <span class="exhibit-template-label">${templateLabelMap[template] || 'Exhibit'}</span>
             </div>
           </div>`;

      return `<article class="exhibit-card" data-template="${template}" onclick="location.href='student-detail.html?id=${w.id}'">
        ${mediaEl}
        <div class="exhibit-body">
          <div class="exhibit-chip-row">
            <span class="card-badge">${escapeHtml(w.anonymous_code)}</span>
            ${isOwn ? '<span class="card-badge" style="background:#10b981;color:#fff;">我的</span>' : ''}
            ${isNew ? '<span class="card-badge new">NEW</span>' : ''}
            ${w.is_pinned ? '<span class="card-badge pinned">置顶</span>' : ''}
            ${w.is_teacher_selected ? '<span class="card-badge" style="background:#fef3c7;color:#b45309;">精选</span>' : ''}
            ${vid ? '<span class="card-badge" style="background:#e0f2fe;color:#0369a1;">MP4</span>' : ''}
          </div>
          <div class="exhibit-kicker">${vid ? 'Motion Piece' : 'Visual Poster'}</div>
          <div class="exhibit-title">${escapeHtml(w.title)}</div>
          <div class="exhibit-subtitle">${escapeHtml((w.description || '').slice(0, 56) || '点击进入查看作品大图、评分与评论。')}</div>
          <div class="exhibit-stats">
            <div class="exhibit-stat">
              <strong>${w.average_rating > 0 ? Number(w.average_rating).toFixed(1) : '-'}</strong>
              <span>平均评分 / ${w.rating_count || 0} 人</span>
            </div>
            <div class="exhibit-stat">
              <strong>${w.comment_count || 0}</strong>
              <span>评论数</span>
            </div>
          </div>
          <div class="exhibit-foot">
            <span>浏览 <strong>${w.view_count || 0}</strong></span>
            <span>${rated ? `已评 ${rated} 分` : (isOwn ? '本人作品' : formatBangkokTime(w.upload_time, { withSeconds: false }))}</span>
          </div>
        </div>
      </article>`;
    }

    function startFiveSecPreview(vid) {
      if (vid._previewSetup) return;
      vid._previewSetup = true;
      vid.play().catch(() => {});
      vid.addEventListener('timeupdate', () => {
        if (vid.currentTime >= 5) {
          vid.currentTime = 0;
          vid.play().catch(() => {});
        }
      });
    }

    loadWorks();
    setInterval(loadWorks, 15000);
  </script>
</body>
</html>
