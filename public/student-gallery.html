<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品画廊 - ClassShow</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">Class<span>Show</span></div>
    <div class="topbar-right">
      <button class="btn btn-sm btn-secondary" onclick="openDisplay()">大屏</button>
      <button class="btn btn-sm btn-secondary" onclick="loadWorks()">刷新</button>
      <button class="btn btn-sm btn-primary" id="uploadBtn" onclick="location.href='student-upload.html?new=1'">上传作品</button>
    </div>
  </div>

  <div class="container">
    <section class="gallery-hero">
      <div class="gallery-kicker">LIVE WORK GALLERY</div>
      <h1 id="galleryTitle">作品画廊</h1>
      <p id="gallerySubtitle">上传作品、浏览同学创作，并为非本人作品进行评分和评论。</p>
      <div class="gallery-actions">
        <button class="btn btn-primary" id="heroUploadBtn" onclick="location.href='student-upload.html?new=1'">上传新作品</button>
        <button class="btn btn-secondary" onclick="openDisplay()">打开大屏展示</button>
      </div>
    </section>

    <div class="stats-row" id="statsRow">
      <div class="stat-card"><div class="stat-value" id="totalWorks">0</div><div class="stat-label">作品总数</div></div>
      <div class="stat-card"><div class="stat-value" id="myRated">0</div><div class="stat-label">已评分数</div></div>
    </div>

    <section class="learning-arena" id="learningArena">
      <div class="learning-arena-shell">
        <div class="learning-arena-copy">
          <span class="learning-kicker">LEARNING ARENA</span>
          <h2>学习力竞技场加载中</h2>
          <p>正在读取在线学习时长、个人排行和小组战力。</p>
        </div>
      </div>
    </section>

    <div id="newSection" style="display:none;">
      <div class="section-header">
        <h3 class="section-title">新作品展示区</h3>
        <span class="card-badge new">10分钟内</span>
      </div>
      <div class="exhibit-grid" id="newGrid"></div>
    </div>

    <div class="rubric" id="rubricBox" style="display:none;">
      <h3>评分标准（1-5分）</h3>
      <ol>
        <li><strong>内容完整性：</strong>作品是否完整、清楚、有主题</li>
        <li><strong>视觉表达：</strong>图片、海报、图表是否清晰美观</li>
        <li><strong>数据使用：</strong>是否使用了真实或合理的数据</li>
        <li><strong>AI辅助质量：</strong>AI 使用是否有效</li>
        <li><strong>创意与实用性：</strong>作品是否有新意</li>
      </ol>
    </div>

    <div class="section-header" style="margin-top:16px;">
      <h3 class="section-title">全部作品</h3>
    </div>
    <div class="exhibit-grid" id="allGrid">
      <div class="empty">还没有作品，快来上传第一个吧。</div>
    </div>
  </div>

  <script>window.CLASSSHOW_SURFACE = 'student';</script>
  <script src="js/deployment-config.js"></script>
  <script src="js/app-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/learning.js"></script>
  <script>
    const user = getSessionOrGuest();
    const actId = getActivityId();
    if (!user || !actId) location.href = 'index.html';

    const act = JSON.parse(sessionStorage.getItem('classshow_activity') || '{}');
    const guest = isGuest();
    let myRatings = {};

    document.getElementById('galleryTitle').textContent = act.activity_name || '作品画廊';
    document.getElementById('gallerySubtitle').textContent =
      [act.course_name, act.class_name].filter(Boolean).join(' · ') || '上传作品、浏览同学创作，并为非本人作品进行评分和评论。';

    if (guest) {
      document.getElementById('uploadBtn').style.display = 'none';
      document.getElementById('heroUploadBtn').style.display = 'none';
      const banner = document.createElement('div');
      banner.style.cssText = 'background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.22);color:#0369a1;padding:11px 16px;border-radius:10px;font-size:0.9rem;margin:16px 0;text-align:center;font-weight:700;';
      banner.innerHTML = '访客模式：可以浏览作品，不能评分或评论。<a href="index.html" style="color:#0369a1;font-weight:900;">登录后参与互动</a>';
      document.querySelector('.container').insertBefore(banner, document.getElementById('statsRow'));
    }

    function openDisplay() {
      const code = (act.invite_code || '').trim();
      const url = code ? ('display.html?code=' + encodeURIComponent(code)) : 'display.html';
      window.open(url, '_blank');
    }

    function buildStatusBadges(work) {
      const chips = [];
      if (work.is_owner) chips.push('<span class="card-badge" style="background:#10b981;color:#fff;">我的</span>');
      if (isNewWork(work.upload_time)) chips.push('<span class="card-badge new">NEW</span>');
      if (work.is_pinned) chips.push('<span class="card-badge pinned">置顶</span>');
      if (work.is_teacher_selected) chips.push('<span class="card-badge" style="background:#fef3c7;color:#b45309;">精选</span>');
      if (isVideo(getWorkMediaUrl(work))) chips.push('<span class="card-badge" style="background:#e0f2fe;color:#0369a1;">MP4</span>');
      if (isVideo(getWorkMediaUrl(work)) && String(work.transcode_status || 'ready').toLowerCase() !== 'ready') {
        chips.push(`<span class="card-badge" style="background:#ede9fe;color:#5b21b6;">${escapeHtml(getTranscodeStatusLabel(work.transcode_status))}</span>`);
      }
      const archiveLabel = getArchiveStatusLabel(work);
      if (archiveLabel) {
        chips.push(`<span class="card-badge" style="background:#ecfccb;color:#3f6212;">${escapeHtml(archiveLabel)}</span>`);
      }
      return chips.join('');
    }

    function workCard(work) {
      const mediaUrl = getWorkMediaUrl(work);
      const thumbUrl = getWorkThumbnailUrl(work);
      const vid = isVideo(mediaUrl);
      const rated = myRatings[work.id];
      const template = pickWorkTemplate(`${work.id || work.anonymous_code}-${work.media_type || ''}`);
      const templateLabelMap = {
        aurora: 'Aurora',
        gallery: 'Gallery',
        signal: 'Signal',
        studio: 'Studio'
      };

      return `
        <article class="exhibit-card" data-template="${template}" onclick="location.href='student-detail.html?id=${work.id}'">
          <div class="exhibit-media skeleton" style="display:flex;align-items:center;justify-content:center;background:${vid ? '#0f172a' : ''};">
            <img class="card-img" style="width:100%;height:100%;opacity:0;transition:opacity 0.5s;" onload="this.style.opacity=1;this.parentElement.classList.remove('skeleton')" src="${thumbUrl || mediaUrl}" alt="${escapeHtml(work.title || '')}" loading="lazy">
            <div class="exhibit-overlay">
              <span class="exhibit-template-label">${vid ? 'Video Cover' : (templateLabelMap[template] || 'Exhibit')}</span>
            </div>
          </div>
          <div class="exhibit-body">
            <div class="exhibit-chip-row">
              <span class="card-badge">${escapeHtml(work.anonymous_code || '')}</span>
              ${buildStatusBadges(work)}
            </div>
            <div class="exhibit-kicker">${vid ? 'Motion Piece' : 'Visual Poster'}</div>
            <div class="exhibit-title">${escapeHtml(work.title || '')}</div>
            <div class="exhibit-subtitle">${escapeHtml((work.description || '').slice(0, 56) || '点击进入查看作品大图、评分与评论。')}</div>
            <div class="exhibit-stats">
              <div class="exhibit-stat">
                <strong>${work.average_rating > 0 ? Number(work.average_rating).toFixed(1) : '-'}</strong>
                <span>平均评分 / ${work.rating_count || 0} 人</span>
              </div>
              <div class="exhibit-stat">
                <strong>${work.comment_count || 0}</strong>
                <span>评论数</span>
              </div>
            </div>
            <div class="exhibit-foot">
              <span>浏览 <strong>${work.view_count || 0}</strong></span>
              <span>${rated ? `已评 ${rated} 分` : (work.is_owner ? '本人作品' : formatBangkokTime(work.upload_time, { withSeconds: false }))}</span>
            </div>
          </div>
        </article>
      `;
    }

    async function loadWorks() {
      try {
        let works = [];
        let ratings = [];
        if (guest) {
          works = await api('/submissions?activity_id=' + actId);
        } else {
          [works, ratings] = await Promise.all([
            api('/submissions?activity_id=' + actId + '&viewer_user_id=' + user.id),
            api('/ratings/my?activity_id=' + actId + '&user_id=' + user.id)
          ]);
        }

        myRatings = {};
        ratings.forEach(item => { myRatings[item.submission_id] = item.score; });
        document.getElementById('totalWorks').textContent = works.length;
        document.getElementById('myRated').textContent = guest ? '-' : ratings.length;
        if (act.voting_open && !guest) document.getElementById('rubricBox').style.display = 'block';

        const newWorks = works.filter(work => isNewWork(work.upload_time));
        const allWorks = works.filter(work => !isNewWork(work.upload_time));
        allWorks.sort((a, b) => {
          if ((b.is_pinned ? 1 : 0) !== (a.is_pinned ? 1 : 0)) return (b.is_pinned ? 1 : 0) - (a.is_pinned ? 1 : 0);
          return new Date(b.upload_time).getTime() - new Date(a.upload_time).getTime();
        });

        if (newWorks.length > 0) {
          document.getElementById('newSection').style.display = 'block';
          document.getElementById('newGrid').innerHTML = newWorks.map(workCard).join('');
        } else {
          document.getElementById('newSection').style.display = 'none';
        }

        document.getElementById('allGrid').innerHTML = allWorks.length
          ? allWorks.map(workCard).join('')
          : '<div class="empty">等待更多作品加入展示墙。</div>';

        if (!act.upload_open) {
          document.getElementById('uploadBtn').style.display = 'none';
          document.getElementById('heroUploadBtn').style.display = 'none';
        }
      } catch (e) {
        toast('加载失败: ' + e.message, 'error');
      }
    }

    loadWorks();
    setInterval(loadWorks, 15000);
  </script>
</body>
</html>
