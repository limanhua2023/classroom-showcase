<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassShow 课堂作品秀</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="launch-page">
  <div class="page-center">
    <div class="launch-shell">
      <section class="launch-intro" aria-label="ClassShow 课堂作品秀">
        <div class="brand-kicker">AI CLASSROOM SHOWCASE</div>
        <h1>让课堂作品<span>真正被看见</span></h1>
        <p>ClassShow 把学生作品上传、实名入场、匿名互评、信息反馈和大屏展示连成一个课堂现场。适合社团招新、AI作品展、课程汇报和项目制学习展示。</p>
        <div class="launch-signals">
          <div class="launch-signal"><strong>实名入场</strong><span>Excel 名单校验，减少冒名和刷分</span></div>
          <div class="launch-signal"><strong>互动互评</strong><span>浏览、评分、评论、反馈统一记录</span></div>
          <div class="launch-signal"><strong>大屏展示</strong><span>新作品、Top 3、全作品自动轮播</span></div>
        </div>
        <div class="launch-wall" aria-hidden="true">
          <div class="launch-tile">AI 海报<br>评分热度 4.8</div>
          <div class="launch-tile">短视频<br>课堂首映</div>
          <div class="launch-tile">项目提案<br>实时反馈</div>
        </div>
      </section>

      <div class="auth-box" style="text-align:center;">
        <h1>Class<span>Show</span></h1>
        <p class="subtitle">课堂作品秀 · 实名参与 · 公平展示</p>

        <div class="login-tabs">
          <button class="login-tab active" id="tabStudent" onclick="switchLoginTab('student')">学生登录</button>
          <button class="login-tab" id="tabGuest" onclick="switchLoginTab('guest')">访客浏览</button>
        </div>

        <div id="panelStudent">
          <div class="form-group">
            <input type="password" id="inviteCode" placeholder="输入课堂邀请码" style="text-align:center;font-size:1.2rem;letter-spacing:2px;">
          </div>
          <button class="btn btn-primary btn-block btn-lg" onclick="joinActivity()">进入课堂</button>
        </div>

        <div id="panelGuest" style="display:none;">
          <div class="guest-badge">访客模式：可浏览全部作品，不能评分或评论</div>
          <div class="form-group">
            <input type="password" id="guestCode" placeholder="输入课堂邀请码" style="text-align:center;font-size:1.2rem;letter-spacing:2px;">
          </div>
          <button class="btn btn-primary btn-block btn-lg" onclick="joinAsGuest()">访客进入</button>
        </div>

        <div class="divider-line">教师入口</div>
        <button class="btn btn-secondary btn-block" onclick="location.href='teacher-login.html'">教师登录</button>
        <div style="margin-top:16px;">
          <button class="btn btn-sm btn-secondary" onclick="location.href='teacher-login.html?create=1'">+ 创建新活动</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('inviteCode').addEventListener('keydown', e => { if (e.key === 'Enter') joinActivity(); });
    document.getElementById('guestCode').addEventListener('keydown', e => { if (e.key === 'Enter') joinAsGuest(); });
    const codeFromUrl = new URLSearchParams(location.search).get('code');
    if (codeFromUrl) {
      const normalized = codeFromUrl.trim().toUpperCase();
      document.getElementById('inviteCode').value = normalized;
      document.getElementById('guestCode').value = normalized;
    }

    function switchLoginTab(tab) {
      const isStudent = tab === 'student';
      document.getElementById('tabStudent').classList.toggle('active', isStudent);
      document.getElementById('tabGuest').classList.toggle('active', !isStudent);
      document.getElementById('panelStudent').style.display = isStudent ? 'block' : 'none';
      document.getElementById('panelGuest').style.display = isStudent ? 'none' : 'block';
    }

    async function joinActivity() {
      const code = document.getElementById('inviteCode').value.trim().toUpperCase();
      if (!code) return toast('请输入邀请码', 'error');
      try {
        const activity = await api('/activities/code/' + code);
        sessionStorage.removeItem('classshow_guest');
        setActivityId(activity.id);
        sessionStorage.setItem('classshow_activity', JSON.stringify(activity));
        location.href = 'student-register.html';
      } catch (e) {
        toast('邀请码无效，请检查后重试', 'error');
      }
    }

    async function joinAsGuest() {
      const code = document.getElementById('guestCode').value.trim().toUpperCase();
      if (!code) return toast('请输入邀请码', 'error');
      try {
        const activity = await api('/activities/code/' + code);
        setGuestSession(activity);
        toast('以访客身份进入...', 'success');
        setTimeout(() => location.href = 'student-gallery.html', 600);
      } catch (e) {
        toast('邀请码无效，请检查后重试', 'error');
      }
    }
  </script>
</body>
</html>
