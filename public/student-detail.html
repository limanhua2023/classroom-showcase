<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品详情 - ClassShow</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="topbar"><div class="topbar-logo">Class<span>Show</span></div>
    <div class="topbar-right"><button class="btn btn-sm btn-secondary" onclick="location.href='student-gallery.html'">← 返回画廊</button></div>
  </div>
  <div class="container" style="max-width:700px;padding-top:24px;">
    <div id="loading" class="empty">加载中...</div>
    <div id="detail" style="display:none;">
      <!-- Media: video player or image, determined by URL -->
      <div id="mediaWrap" style="margin-bottom:16px;"></div>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <span class="card-badge" id="workCode"></span>
        <span class="card-badge new" id="newBadge" style="display:none;">NEW</span>
      </div>
      <div id="ownerActions" style="display:none;margin-bottom:20px;gap:10px;">
        <button class="btn btn-sm btn-secondary" onclick="location.href='student-upload.html'" style="flex:1;">✏️ 修改作品</button>
        <button class="btn btn-sm btn-danger" onclick="deleteMyWork()" style="flex:1;">🗑️ 删除作品</button>
      </div>
      <h1 id="workTitle" style="font-size:1.5rem;margin-bottom:8px;"></h1>
      <p id="workDesc" style="color:var(--text-muted);line-height:1.6;margin-bottom:16px;"></p>
      <div class="card-meta" style="margin-bottom:24px;">
        <span>👁 <span id="viewCount">0</span> 浏览</span>
        <span>💬 <span id="commentCount">0</span> 评论</span>
        <span>⭐ <span id="avgScore">-</span> 平均分</span>
        <span>👥 <span id="rateCount">0</span> 人评分</span>
      </div>
      <!-- Rating Section -->
      <div id="ratingSection" class="card" style="padding:24px;text-align:center;">
        <h3 style="margin-bottom:12px;" id="ratingTitle">为这份作品评分</h3>
        <div class="stars" id="stars">
          <span class="star" data-v="1" onclick="rate(1)" onmouseenter="hoverStar(1)" onmouseleave="resetStars()">★</span>
          <span class="star" data-v="2" onclick="rate(2)" onmouseenter="hoverStar(2)" onmouseleave="resetStars()">★</span>
          <span class="star" data-v="3" onclick="rate(3)" onmouseenter="hoverStar(3)" onmouseleave="resetStars()">★</span>
          <span class="star" data-v="4" onclick="rate(4)" onmouseenter="hoverStar(4)" onmouseleave="resetStars()">★</span>
          <span class="star" data-v="5" onclick="rate(5)" onmouseenter="hoverStar(5)" onmouseleave="resetStars()">★</span>
        </div>
        <p id="ratingHint" style="margin-top:8px;color:var(--text-muted);font-size:0.9rem;"></p>
      </div>
      </div>
      
      <!-- Comments Section -->
      <div id="commentsWrapper" style="display:none;" class="comments-section">
        <h3 style="margin-bottom:16px;">💬 匿名评价</h3>
        <div id="commentsList">
          <div class="empty" style="padding:20px;">暂无评价，来说第一句吧！</div>
        </div>
        <div class="comment-input-wrap" id="commentFormWrapper" style="display:none;">
          <input type="text" id="commentInput" placeholder="写下你的鼓励或建议..." maxlength="100">
          <button class="btn btn-primary" onclick="postComment()">发送</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="modal" id="lightboxModal" onclick="this.classList.remove('active')">
    <button class="modal-close" onclick="document.getElementById('lightboxModal').classList.remove('active')">×</button>
    <img id="lightboxImg" class="lightbox-img" onclick="event.stopPropagation()">
  </div>
  <script src="js/api.js"></script>
  <script>
    const user = getSessionOrGuest(); const actId = getActivityId();
    if (!user || !actId) location.href = 'index.html';
    const act = JSON.parse(sessionStorage.getItem('classshow_activity') || '{}');
    const guest = isGuest();
    const sid = new URLSearchParams(location.search).get('id');
    let currentRating = 0; let work = null;

    async function load() {
      try {
        work = await api('/submissions/' + sid);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('detail').style.display = 'block';
        const mediaUrl = work.image_url;
        const mediaWrap = document.getElementById('mediaWrap');
        if (isVideo(mediaUrl)) {
          mediaWrap.innerHTML = `
            <video src="${mediaUrl}" controls autoplay muted playsinline
              style="width:100%;border-radius:var(--radius);max-height:520px;background:#0f172a;display:block;"
              oncanplay="this.muted=false"></video>
            <p style="text-align:center;font-size:0.8rem;color:var(--text-muted);margin-top:6px;">🎬 点击播放完整视频</p>`;
        } else {
          mediaWrap.innerHTML = `<img src="${mediaUrl}" style="width:100%;border-radius:var(--radius);max-height:500px;object-fit:contain;background:#f0f2f5;cursor:zoom-in;" onclick="openLightbox('${mediaUrl}')">` ;
        }
        document.getElementById('workCode').textContent = work.anonymous_code;
        document.getElementById('workTitle').textContent = work.title;
        document.getElementById('workDesc').textContent = work.description || '';
        document.getElementById('viewCount').textContent = work.view_count;
        document.getElementById('commentCount').textContent = work.comment_count || 0;
        document.getElementById('avgScore').textContent = work.average_rating > 0 ? Number(work.average_rating).toFixed(1) : '-';
        document.getElementById('rateCount').textContent = work.rating_count;
        if (isNewWork(work.upload_time)) document.getElementById('newBadge').style.display = 'inline';

        // Record view (after 3 seconds) — skip for guests (no user id)
        if (!guest && user.id) {
          setTimeout(() => { api('/views', { method: 'POST', body: JSON.stringify({ submission_id: sid, viewer_user_id: user.id }) }); }, 3000);
        }

        // Load comments section
        if (act.comments_open) {
          document.getElementById('commentsWrapper').style.display = 'block';
          loadComments();
          // Only show comment input for logged-in non-authors
          if (!guest && work.user_id !== user.id) {
            document.getElementById('commentFormWrapper').style.display = 'flex';
          }
        }

        // ─── Guest: replace rating section with login prompt ───
        if (guest) {
          document.getElementById('ratingSection').innerHTML =
            '<div style="text-align:center;padding:16px;color:var(--text-muted);">' +
            '<p style="font-size:1.5rem;margin-bottom:8px;">👁</p>' +
            '<p style="margin-bottom:12px;">访客模式不可评分</p>' +
            '<a href="index.html" class="btn btn-primary btn-sm">🔑 登录以参与互动</a></div>';
          return;
        }

        // ─── Rating Section ───
        if (!guest && work.user_id === user.id) {
          document.getElementById('ownerActions').style.display = 'flex';
          document.getElementById('ratingSection').innerHTML = '<p style="color:var(--text-muted);text-align:center;">这是你自己的作品，你可以修改或删除它。</p>';
          return;
        }
        if (!act.voting_open) {
          document.getElementById('ratingSection').innerHTML = '<p style="color:var(--text-muted);">评分尚未开启，请等待教师开启。</p>';
          return;
        }
        // Check existing rating
        const myRatings = await api('/ratings/my?activity_id=' + actId + '&user_id=' + user.id);
        const existing = myRatings.find(r => r.submission_id === sid);
        if (existing) { currentRating = existing.score; updateStars(); document.getElementById('ratingHint').textContent = '你已评 ' + existing.score + ' 分（点击可修改）'; }
      } catch (e) { document.getElementById('loading').innerHTML = '加载失败'; }
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxModal').classList.add('active');
    }

    async function deleteMyWork() {
      if (!confirm('确定要删除这件作品吗？删除后不可恢复。')) return;
      try {
        await api('/submissions/' + sid, { method: 'DELETE', body: JSON.stringify({ user_id: user.id }) });
        toast('作品已删除', 'success');
        setTimeout(() => location.href = 'student-gallery.html', 1000);
      } catch (err) { toast(err.message, 'error'); }
    }

    async function loadComments() {
      try {
        const comments = await api('/comments?submission_id=' + sid);
        if (comments.length > 0) {
          document.getElementById('commentsList').innerHTML = comments.map(c => `
            <div class="comment-item">
              <div class="comment-avatar">匿</div>
              <div class="comment-content">
                <div>${c.content}</div>
                <div class="comment-time">${timeAgo(c.created_at)}</div>
              </div>
            </div>
          `).join('');
        }
      } catch (e) { console.error(e); }
    }

    async function postComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text) return;
      try {
        await api('/comments', { method: 'POST', body: JSON.stringify({
          activity_id: actId, submission_id: sid, user_id: user.id, content: text
        })});
        input.value = '';
        toast('评价发布成功', 'success');
        loadComments();
      } catch (e) { toast('发布失败: ' + e.message, 'error'); }
    }

    function hoverStar(n) { document.querySelectorAll('.star').forEach(s => s.classList.toggle('hover', parseInt(s.dataset.v) <= n)); }
    function resetStars() { document.querySelectorAll('.star').forEach(s => s.classList.remove('hover')); }
    function updateStars() { document.querySelectorAll('.star').forEach(s => s.classList.toggle('active', parseInt(s.dataset.v) <= currentRating)); }

    async function rate(score) {
      try {
        const res = await api('/ratings', { method: 'POST', body: JSON.stringify({
          activity_id: actId, submission_id: sid, rater_user_id: user.id, score
        })});
        currentRating = score; updateStars();
        document.getElementById('ratingHint').textContent = '评分成功！你打了 ' + score + ' 分';
        document.getElementById('avgScore').textContent = Number(res.average).toFixed(1);
        document.getElementById('rateCount').textContent = res.count;
        toast('评分成功！', 'success');
      } catch (e) { toast(e.message, 'error'); }
    }
    load();
  </script>
</body>
</html>
