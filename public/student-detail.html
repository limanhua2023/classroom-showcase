<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品详情 - ClassShow</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .detail-shell {
      max-width: 860px;
      padding-top: 24px;
      padding-bottom: 48px;
    }
    .detail-hero { margin-bottom: 18px; }
    .detail-media {
      overflow: hidden;
      border-radius: 22px;
      background: rgba(15, 23, 42, 0.06);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: var(--shadow);
    }
    .detail-media img,
    .detail-media video {
      width: 100%;
      max-height: 560px;
      object-fit: contain;
      background: #0f172a;
    }
    .detail-card {
      margin-top: 18px;
      padding: 22px;
      border-radius: 22px;
      background: var(--surface);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: var(--shadow);
    }
    .detail-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .detail-title {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      line-height: 1.1;
      letter-spacing: -0.05em;
      font-weight: 900;
    }
    .detail-desc {
      margin-top: 10px;
      color: var(--text-muted);
      line-height: 1.75;
    }
    .detail-meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .detail-meta-card {
      padding: 14px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(15, 23, 42, 0.06);
    }
    .detail-meta-card strong {
      display: block;
      font-size: 1.1rem;
      font-weight: 900;
    }
    .detail-meta-card span {
      display: block;
      margin-top: 5px;
      color: var(--text-light);
      font-size: 0.8rem;
    }
    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .detail-actions .btn { flex: 1 1 180px; }
    @media (max-width: 640px) {
      .detail-meta-grid { grid-template-columns: 1fr 1fr; }
      .detail-actions .btn { flex-basis: 100%; }
    }
    @media (max-width: 480px) {
      .detail-meta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">Class<span>Show</span></div>
    <div class="topbar-right">
      <button class="btn btn-sm btn-secondary" onclick="location.href='student-gallery.html'">返回画廊</button>
    </div>
  </div>

  <div class="container detail-shell">
    <div id="loading" class="empty">正在加载作品...</div>

    <div id="detail" style="display:none;">
      <section class="gallery-hero detail-hero">
        <div class="gallery-kicker">Work Detail</div>
        <h1 id="heroTitle">作品详情</h1>
        <p id="heroSubtitle">点击放大查看，支持评分、评论与再次编辑。</p>
      </section>

      <div class="detail-media" id="mediaWrap"></div>

      <div class="detail-card">
        <div class="detail-chip-row" id="detailChips">
          <span class="card-badge" id="workCode"></span>
          <span class="card-badge new" id="newBadge" style="display:none;">NEW</span>
          <span class="card-badge" id="workTypeBadge"></span>
        </div>

        <div class="detail-title" id="workTitle"></div>
        <div class="detail-desc" id="workDesc"></div>

        <div class="detail-meta-grid">
          <div class="detail-meta-card"><strong id="viewCount">0</strong><span>浏览量</span></div>
          <div class="detail-meta-card"><strong id="commentCount">0</strong><span>评论数</span></div>
          <div class="detail-meta-card"><strong id="avgScore">-</strong><span>平均分</span></div>
          <div class="detail-meta-card"><strong id="rateCount">0</strong><span>评分人数</span></div>
        </div>

        <div class="detail-actions" id="ownerActions" style="display:none;">
          <button class="btn btn-primary" onclick="location.href='student-upload.html?new=1'">上传新作品</button>
          <button class="btn btn-secondary" onclick="editCurrentWork()">修改这份作品</button>
          <button class="btn btn-danger" onclick="deleteMyWork()">删除这份作品</button>
        </div>
      </div>

      <div id="ratingSection" class="detail-card" style="text-align:center;">
        <h3 style="margin-bottom:12px;" id="ratingTitle">为这份作品评分</h3>
        <div class="stars" id="stars">
          <span class="star" data-v="1" onclick="rate(1)" onmouseenter="hoverStar(1)" onmouseleave="resetStars()">★</span>
          <span class="star" data-v="2" onclick="rate(2)" onmouseenter="hoverStar(2)" onmouseleave="resetStars()">★</span>
          <span class="star" data-v="3" onclick="rate(3)" onmouseenter="hoverStar(3)" onmouseleave="resetStars()">★</span>
          <span class="star" data-v="4" onclick="rate(4)" onmouseenter="hoverStar(4)" onmouseleave="resetStars()">★</span>
          <span class="star" data-v="5" onclick="rate(5)" onmouseenter="hoverStar(5)" onmouseleave="resetStars()">★</span>
        </div>
        <p id="ratingHint" style="margin-top:10px;color:var(--text-muted);font-size:0.9rem;"></p>
      </div>

      <div id="commentsWrapper" class="detail-card" style="display:none;">
        <h3 style="margin-bottom:16px;">匿名评论</h3>
        <div id="commentsList">
          <div class="empty" style="padding:20px;">暂无评论，来留下第一条吧。</div>
        </div>
        <div class="comment-input-wrap" id="commentFormWrapper" style="display:none;">
          <input type="text" id="commentInput" placeholder="写下你的鼓励、建议或评价..." maxlength="100">
          <button class="btn btn-primary" onclick="postComment()">发布</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="lightboxModal" onclick="this.classList.remove('active')">
    <button class="modal-close" onclick="document.getElementById('lightboxModal').classList.remove('active')">×</button>
    <img id="lightboxImg" class="lightbox-img" onclick="event.stopPropagation()" alt="作品大图">
  </div>

  <script src="js/api.js"></script>
  <script src="js/learning.js"></script>
  <script>
    const user = getSessionOrGuest();
    const actId = getActivityId();
    if (!user || !actId) location.href = 'index.html';

    const act = JSON.parse(sessionStorage.getItem('classshow_activity') || '{}');
    const guest = isGuest();
    const sid = new URLSearchParams(location.search).get('id');
    let currentRating = 0;
    let work = null;

    function editCurrentWork() {
      location.href = 'student-upload.html?id=' + encodeURIComponent(sid);
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxModal').classList.add('active');
    }

    function hoverStar(n) {
      document.querySelectorAll('.star').forEach(star => star.classList.toggle('hover', Number(star.dataset.v) <= n));
    }

    function resetStars() {
      document.querySelectorAll('.star').forEach(star => star.classList.remove('hover'));
    }

    function updateStars() {
      document.querySelectorAll('.star').forEach(star => star.classList.toggle('active', Number(star.dataset.v) <= currentRating));
    }

    async function loadComments() {
      try {
        const comments = await api('/comments?submission_id=' + sid);
        if (!comments.length) {
          document.getElementById('commentsList').innerHTML = '<div class="empty" style="padding:20px;">暂无评论，来留下第一条吧。</div>';
          return;
        }
        document.getElementById('commentsList').innerHTML = comments.map(comment => `
          <div class="comment-item">
            <div class="comment-avatar">匿</div>
            <div class="comment-content">
              <div>${escapeHtml(comment.content)}</div>
              <div class="comment-time">${timeAgo(comment.created_at)}</div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function postComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text) return;
      try {
        await api('/comments', {
          method: 'POST',
          body: JSON.stringify({
            activity_id: actId,
            submission_id: sid,
            user_id: user.id,
            content: text
          })
        });
        input.value = '';
        toast('评论发布成功', 'success');
        loadComments();
      } catch (e) {
        toast('发布失败：' + e.message, 'error');
      }
    }

    async function deleteMyWork() {
      if (!confirm('确认删除这份作品吗？删除后不可恢复。')) return;
      try {
        await api('/submissions/' + sid, {
          method: 'DELETE',
          body: JSON.stringify({ activity_id: actId, user_id: user.id })
        });
        toast('作品已删除', 'success');
        setTimeout(() => location.href = 'student-gallery.html', 900);
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function rate(score) {
      try {
        const result = await api('/ratings', {
          method: 'POST',
          body: JSON.stringify({
            activity_id: actId,
            submission_id: sid,
            rater_user_id: user.id,
            score
          })
        });
        currentRating = score;
        updateStars();
        document.getElementById('ratingHint').textContent = `你已评 ${score} 分，可再次点击修改`;
        document.getElementById('avgScore').textContent = Number(result.average).toFixed(1);
        document.getElementById('rateCount').textContent = result.count;
        toast('评分成功', 'success');
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    function appendStatusChips(currentWork) {
      const box = document.getElementById('detailChips');
      if (isVideo(getWorkMediaUrl(currentWork)) && String(currentWork.transcode_status || 'ready').toLowerCase() !== 'ready') {
        box.insertAdjacentHTML('beforeend', `<span class="card-badge" style="background:#ede9fe;color:#5b21b6;">${escapeHtml(getTranscodeStatusLabel(currentWork.transcode_status))}</span>`);
      }
      const archiveLabel = getArchiveStatusLabel(currentWork);
      if (archiveLabel) {
        box.insertAdjacentHTML('beforeend', `<span class="card-badge" style="background:#ecfccb;color:#3f6212;">${escapeHtml(archiveLabel)}</span>`);
      }
    }

    async function load() {
      try {
        const qs = (!guest && user.id) ? ('?viewer_user_id=' + encodeURIComponent(user.id)) : '';
        work = await api('/submissions/' + sid + qs);
        const mediaUrl = getWorkMediaUrl(work);
        const posterUrl = getWorkPosterUrl(work);
        const vid = isVideo(mediaUrl);

        document.getElementById('loading').style.display = 'none';
        document.getElementById('detail').style.display = 'block';
        document.getElementById('heroTitle').textContent = work.title || '作品详情';
        document.getElementById('heroSubtitle').textContent = `${act.activity_name || '课堂活动'} · ${formatBangkokTime(work.upload_time)}`;
        document.getElementById('workCode').textContent = work.anonymous_code || '';
        document.getElementById('workTypeBadge').textContent = vid ? '视频作品' : '图片作品';
        document.getElementById('workTitle').textContent = work.title || '';
        document.getElementById('workDesc').textContent = work.description || '暂无说明';
        document.getElementById('viewCount').textContent = work.view_count || 0;
        document.getElementById('commentCount').textContent = work.comment_count || 0;
        document.getElementById('avgScore').textContent = work.average_rating > 0 ? Number(work.average_rating).toFixed(1) : '-';
        document.getElementById('rateCount').textContent = work.rating_count || 0;
        if (isNewWork(work.upload_time)) document.getElementById('newBadge').style.display = 'inline-flex';
        appendStatusChips(work);

        const mediaWrap = document.getElementById('mediaWrap');
        if (vid) {
          mediaWrap.innerHTML = `<video src="${mediaUrl}" poster="${posterUrl}" controls autoplay muted playsinline oncanplay="this.muted=false"></video>`;
        } else {
          mediaWrap.innerHTML = `<img id="detailImage" src="${mediaUrl}" alt="${escapeHtml(work.title || '')}" style="cursor:zoom-in;">`;
          document.getElementById('detailImage').addEventListener('click', () => openLightbox(mediaUrl));
        }

        if (!guest && user.id) {
          setTimeout(() => {
            api('/views', {
              method: 'POST',
              body: JSON.stringify({
                activity_id: actId,
                submission_id: sid,
                viewer_user_id: user.id
              })
            }).catch(() => {});
          }, 3000);
        }

        if (act.comments_open) {
          document.getElementById('commentsWrapper').style.display = 'block';
          loadComments();
          if (!guest && !work.is_owner) {
            document.getElementById('commentFormWrapper').style.display = 'flex';
          }
        }

        if (guest) {
          document.getElementById('ratingSection').innerHTML = `
            <div style="text-align:center;padding:12px;color:var(--text-muted);">
              <p style="font-size:1.5rem;margin-bottom:8px;">👀</p>
              <p style="margin-bottom:12px;">访客模式只能浏览，不能评分或评论。</p>
              <a href="index.html" class="btn btn-primary btn-sm">登录后参与互动</a>
            </div>
          `;
          return;
        }

        if (work.is_owner) {
          document.getElementById('ownerActions').style.display = 'flex';
          document.getElementById('ratingSection').innerHTML = '<p style="color:var(--text-muted);text-align:center;">这是你自己的作品。你可以修改、删除，或重新上传一份新作品。</p>';
          return;
        }

        if (!act.voting_open) {
          document.getElementById('ratingSection').innerHTML = '<p style="color:var(--text-muted);text-align:center;">老师暂未开启评分。</p>';
          return;
        }

        const myRatings = await api('/ratings/my?activity_id=' + actId + '&user_id=' + user.id);
        const existing = (myRatings || []).find(item => String(item.submission_id) === String(sid));
        if (existing) {
          currentRating = Number(existing.score) || 0;
          updateStars();
          document.getElementById('ratingHint').textContent = `你已评 ${existing.score} 分，可再次点击修改`;
        } else {
          document.getElementById('ratingHint').textContent = '点击星星即可匿名评分';
        }
      } catch (e) {
        document.getElementById('loading').innerHTML = '加载失败';
        toast('加载失败：' + e.message, 'error');
      }
    }

    load();
  </script>
</body>
</html>
